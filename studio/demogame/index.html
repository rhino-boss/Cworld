<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demogame · Cworld</title>
  <!-- Cworld 的 C 字圖示（inline SVG favicon） -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d32020'/%3E%3Ctext x='32' y='46' font-family='Helvetica,Arial,sans-serif' font-size='46' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f7f7f5; --surface: #fff; --border: #e8e8e4;
      --text: #1a1a1a; --muted: #6b6b6b;
      --accent-dark: #4a3828; --accent-mid: #7a5c3a;
      --card-edge: #e6e6e2;
      --radius: 14px;
    }
    body { font-family: 'Helvetica Neue','PingFang TC','Microsoft JhengHei',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .hero { background: linear-gradient(135deg, var(--accent-dark), var(--accent-mid)); padding: 40px 48px 36px; color: #fff; }
    /* 左上返回：走瀏覽器歷史，不暴露站內其他網址 */
    .hero-back {
      display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px;
      background: rgba(255,255,255,.14); color: #fff; border: 0;
      padding: 7px 14px; border-radius: 8px; font-size: .82rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .hero-back:hover { background: rgba(255,255,255,.28); }
    .hero h1 { font-size: 1.75rem; font-weight: 700; }
    .hero p { margin-top: 6px; font-size: .9rem; opacity: .7; }

    /* 1360px 上限 ≈ 最多 3 欄，視窗變窄自動降成 2 欄 / 1 欄，卡片寬度維持 ~400px */
    .container { max-width: 1360px; margin: 0 auto; padding: 36px 48px 80px; }

    .status-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; font-size: .82rem; color: var(--muted); flex-wrap: wrap; }

    /* 排序控制列 */
    .sort-bar { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .sort-label { margin-right: 2px; }
    .sort-btn {
      font-family: inherit; font-size: .78rem; font-weight: 600; cursor: pointer;
      padding: 6px 12px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      transition: background .15s, color .15s, border-color .15s;
    }
    .sort-btn:hover { border-color: var(--accent-mid); color: var(--text); }
    .sort-btn.active { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
    .sort-dir { width: 38px; font-size: .9rem; line-height: 1; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .dot.loading { background: #f0a020; animation: pulse 1s infinite; }
    .dot.done { background: #3a8a50; }
    .dot.error { background: #c0392b; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }

    .grid {
      display: grid; gap: 26px; justify-content: center;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    }

    /* ── 卡片：PG 風格（白底、粉色描邊、緞帶、雙按鈕） ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--card-edge);
      border-radius: 18px; padding: 12px 12px 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
      transition: box-shadow .2s, transform .2s;
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }
    .card.has-demo:hover { box-shadow: 0 10px 28px rgba(0,0,0,.14); transform: translateY(-4px); }

    /* 右上角金色 NEW 緞帶 */
    .ribbon {
      position: absolute; top: 0; right: 0; width: 92px; height: 92px;
      overflow: hidden; pointer-events: none; z-index: 2;
    }
    .ribbon span {
      position: absolute; top: 18px; right: -26px; width: 120px;
      transform: rotate(45deg);
      background: linear-gradient(135deg, #f6d365, #c9962f);
      color: #fff; font-size: .68rem; font-weight: 800; letter-spacing: 1px;
      text-align: center; padding: 4px 0;
      box-shadow: 0 2px 6px rgba(0,0,0,.22);
    }

    /* 封面依原圖比例顯示，不裁切 */
    .card-cover {
      width: 100%; aspect-ratio: 330/250; border-radius: 12px;
      background: linear-gradient(135deg, #3a2c1a, #6b4e2a);
      position: relative; overflow: hidden;
    }
    .card-cover img { display: block; width: 100%; height: auto; position: relative; z-index: 1; }
    /* 只有沒圖時才看得到的佔位 icon；有 banner 時直接移除 */
    .card-cover .ph {
      position: absolute; inset: 0; z-index: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem;
    }
    .card-cover .no-demo-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      font-size: .78rem; font-weight: 700; color: rgba(255,255,255,.6);
      letter-spacing: .5px;
    }

    .card-body { padding: 14px 8px 0; flex: 1; text-align: center; }
    .card-title {
      font-size: 1rem; font-weight: 800; letter-spacing: .5px;
      padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .card-desc {
      padding: 12px 4px 14px; font-size: .8rem; color: var(--muted);
      line-height: 1.5; min-height: 62px;
      display: flex; align-items: center; justify-content: center;
    }

    .card-footer { display: flex; gap: 10px; padding: 0 8px; margin-top: auto; }
    .btn {
      flex: 1; border: 0; font-family: inherit; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 11px 10px; border-radius: 8px; white-space: nowrap;
      text-decoration: none; font-size: .82rem; font-weight: 700;
      transition: background .15s, opacity .15s;
    }
    .btn .ico { padding-left: 10px; border-left: 1px solid rgba(255,255,255,.25); line-height: 1; }
    .btn-info { background: #1a1a1a; color: #fff; }
    .btn-info:hover { background: #333; }
    .btn.is-static { cursor: default; }        /* 遊戲資訊目前只是版位，不連結 */
    .btn.is-static:hover { background: #1a1a1a; }
    .btn-play { background: #d32020; color: #fff; }
    .btn-play:hover { background: #ef3a3a; }
    .btn.disabled { background: var(--bg); border: 1px dashed var(--border); color: var(--muted); cursor: default; }

    .skeleton { animation: shimmer 1.2s infinite linear; background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%); background-size: 200% 100%; border-radius: var(--radius); }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel-card { height: 320px; }

    .error-msg { text-align: center; padding: 60px 24px; color: var(--muted); }
    .error-msg .icon { font-size: 2.5rem; margin-bottom: 12px; }

    /* ── 遊戲播放層：同頁 iframe 開啟，不另開分頁 ── */
    .player { position: fixed; inset: 0; z-index: 100; background: #111; display: none; flex-direction: column; }
    .player.open { display: flex; }
    .player-bar {
      flex-shrink: 0; height: 52px; background: var(--accent-dark); color: #fff;
      display: flex; align-items: center; gap: 12px; padding: 0 14px;
    }
    .player-back {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.14); color: #fff; border: 0;
      padding: 8px 14px; border-radius: 8px; font-size: .85rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .player-back:hover { background: rgba(255,255,255,.26); }
    .player-title { font-size: .9rem; font-weight: 700; opacity: .9; }
    .player iframe { flex: 1; width: 100%; border: 0; background: #000; }
    body.playing { overflow: hidden; }

    @media (max-width: 720px) {
      .hero { padding: 28px 24px; }
      .container { padding: 24px 16px 60px; }
      /* 手機一排一張大卡，避免按鈕被擠成直排 */
      .grid { grid-template-columns: 1fr; gap: 20px; }
      .card { padding: 14px 14px 18px; }
      .card-title { font-size: 1.15rem; }
      .card-desc { font-size: .88rem; min-height: 0; padding: 14px 4px 18px; }
      .btn { padding: 13px 12px; font-size: .9rem; }
    }
  </style>
</head>
<body>

<!-- 這頁會分享給外部，不放任何回到 Cworld 其他頁面的連結 -->

<div class="hero">
  <button class="hero-back" id="hero-back" type="button" hidden>← 返回上一頁</button>
  <h1>🎰 Demogame</h1>
  <p>自製的 Slot 遊戲，點進去直接玩</p>
</div>

<div class="container">
  <div class="status-bar">
    <div class="dot loading" id="status-dot"></div>
    <span id="status-text">讀取遊戲清單中…</span>
    <div class="sort-bar" id="sort-bar" hidden>
      <span class="sort-label">排序</span>
      <button class="sort-btn" type="button" data-key="date">更新時間</button>
      <button class="sort-btn" type="button" data-key="gameid">遊戲編號</button>
      <button class="sort-btn sort-dir" type="button" id="sort-dir">↓</button>
    </div>
  </div>
  <div class="grid" id="game-grid">
    <!-- 骨架屏 -->
    <div class="skeleton skel-card"></div>
    <div class="skeleton skel-card"></div>
    <div class="skeleton skel-card"></div>
  </div>
</div>

<div class="player" id="player">
  <div class="player-bar">
    <button class="player-back" id="player-back" type="button">← 返回遊戲列表</button>
    <span class="player-title" id="player-title"></span>
  </div>
  <iframe id="player-frame" title="遊戲" allow="autoplay; fullscreen" allowfullscreen></iframe>
</div>

<script>
const REPO_OWNER = 'rhino-boss';
const REPO_NAME  = 'Jumbo';
const SLOTS_PATH = 'Project/Slots';
const PAGES_BASE = `https://${REPO_OWNER}.github.io/${REPO_NAME}`;
// 遊戲封面圖統一放在 Slots/其他/遊戲資源/，檔名為遊戲代號（H013.png）
const ASSETS_BASE = `${PAGES_BASE}/${SLOTS_PATH}/${encodeURIComponent('其他')}/${encodeURIComponent('遊戲資源')}`;

// 從資料夾名稱解析 id 和顯示名稱
// 格式：H026_彩罐熱舞 → { id: 'H026', title: '彩罐熱舞' }
function parseFolderName(name) {
  const m = name.match(/^([A-Za-z0-9]+)_(.+)$/);
  if (m) return { id: m[1], title: m[2] };
  return { id: '', title: name };
}

async function fetchJson(url) {
  const res = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// 從遊戲資料夾的 game_rule.md 讀「遊戲類型」與「PARsheet ID」
// 對應表格列：| 遊戲類型 | Video Slot - Ways / Cascade | 、| PARsheet ID | H0131 |
async function fetchRuleInfo(gameBase) {
  const empty = { gameType: '', parsheetId: '' };
  try {
    const res = await fetch(`${gameBase}/game_rule.md`);
    if (!res.ok) return empty;
    const text = await res.text();
    const cell = label => {
      const m = text.match(new RegExp(`\\|\\s*${label}\\s*\\|([^|\\n]*)\\|`));
      const v = m ? m[1].trim().replace(/^`|`$/g, '') : '';
      return (!v || v === '-') ? '' : v;
    };
    return { gameType: cell('遊戲類型'), parsheetId: cell('PARsheet ID') };
  } catch { return empty; }
}

// 「數學最後更新時間」＝該遊戲 Source/ 資料夾的最後一筆 commit 時間
// 查不到（沒有 Source、或 API 額度用完）回 0，排序時會沉到最後
// 結果快取 6 小時，避免每次進頁面都吃掉 GitHub API 額度（未登入每小時 60 次）
const MATH_CACHE_KEY = 'demogame-math-dates';
const MATH_CACHE_TTL = 6 * 60 * 60 * 1000;

const mathCache = (() => {
  try {
    const c = JSON.parse(localStorage.getItem(MATH_CACHE_KEY) || '{}');
    return (Date.now() - (c.at || 0) < MATH_CACHE_TTL) ? (c.dates || {}) : {};
  } catch { return {}; }
})();

function saveMathCache() {
  try {
    localStorage.setItem(MATH_CACHE_KEY, JSON.stringify({ at: Date.now(), dates: mathCache }));
  } catch { /* localStorage 不可用就算了 */ }
}

async function fetchMathDate(folder) {
  if (folder in mathCache) return mathCache[folder];
  let ts = 0;
  try {
    const path = `${SLOTS_PATH}/${folder}/Source`;
    const res = await fetch(
      `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/commits?path=${encodeURIComponent(path)}&per_page=1`,
      { headers: { Accept: 'application/vnd.github+json' } }
    );
    if (res.ok) {
      const arr = await res.json();
      ts = arr[0] ? Date.parse(arr[0].commit.committer.date) || 0 : 0;
    }
  } catch { /* 失敗就當作沒有時間 */ }
  mathCache[folder] = ts;
  saveMathCache();
  return ts;
}

async function init() {
  const grid = document.getElementById('game-grid');
  const dot  = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');

  try {
    // 1) 取得 Slots 目錄的 tree sha（第 1 次 API）
    const projItems = await fetchJson(
      `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/Project`
    );
    const slotsDir = projItems.find(i => i.type === 'dir' && i.name === 'Slots');
    if (!slotsDir) throw new Error('找不到 Slots 目錄');

    // 2) 一次抓整棵 Slots 子樹（第 2 次 API）——避免逐資料夾呼叫觸發速率限制
    const tree = await fetchJson(
      `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${slotsDir.sha}?recursive=1`
    );
    const nodes = tree.tree || [];

    // 只取頂層符合「H###_名稱」格式的遊戲資料夾（排除 其他／未完成 等）
    const folders = nodes
      .filter(n => n.type === 'tree' && /^[A-Za-z0-9]+_[^/]+$/.test(n.path))
      .map(n => n.path);

    if (folders.length === 0) {
      grid.innerHTML = '<div class="error-msg"><div class="icon">📭</div><p>目前還沒有遊戲</p></div>';
      dot.className = 'dot done'; statusText.textContent = '沒有找到遊戲';
      return;
    }

    // 從同一棵樹判斷每個資料夾是否有 index.html（不再逐一打 API）
    const hasFile = (folder, file) =>
      nodes.some(n => n.type === 'blob' && n.path.toLowerCase() === `${folder}/${file}`.toLowerCase());

    const results = folders.map(folder => ({
      ...parseFolderName(folder),
      folderName: folder,
      hasDemo: hasFile(folder, 'index.html'),
      hasRule: hasFile(folder, 'game_rule.md'),
    }));

    // 讀各遊戲的 game_rule.md 取遊戲類型 / PARsheet ID（與本頁同網域，無 CORS 問題）
    // 同時查各遊戲 Source/ 的最後 commit 時間，當作「數學最後更新時間」
    await Promise.all(results.map(async g => {
      const [rule, mathDate] = await Promise.all([
        g.hasRule
          ? fetchRuleInfo(`${PAGES_BASE}/${SLOTS_PATH}/${encodeURIComponent(g.folderName)}`)
          : Promise.resolve({ gameType: '', parsheetId: '' }),
        fetchMathDate(g.folderName),
      ]);
      g.gameType = rule.gameType;
      g.parsheetId = rule.parsheetId;
      g.mathDate = mathDate;
    }));

    const demoCount = results.filter(r => r.hasDemo).length;
    dot.className = 'dot done';
    statusText.textContent = `共 ${results.length} 款遊戲，${demoCount} 款可遊玩`;

    games = results;
    document.getElementById('sort-bar').hidden = false;
    render();
  } catch (e) {
    dot.className = 'dot error';
    statusText.textContent = '讀取失敗';
    grid.innerHTML = `<div class="error-msg"><div class="icon">⚠️</div><p>無法讀取遊戲清單<br><small>${e.message}</small></p></div>`;
  }
}

// ── 排序 ──
let games = [];
const sortState = (() => {
  try { return JSON.parse(localStorage.getItem('demogame-sort')) || {}; } catch { return {}; }
})();
let sortKey = sortState.key === 'gameid' ? 'gameid' : 'date';       // date | gameid
let sortDesc = sortState.desc !== false;                            // true = 新→舊 / 大→小

function render() {
  const grid = document.getElementById('game-grid');
  const dir = sortDesc ? 1 : -1;
  const val = g => sortKey === 'date' ? (g.mathDate || 0) : (g.id || '');
  const sorted = [...games].sort((a, b) => {
    const va = val(a), vb = val(b);
    // 查不到值的（沒有 Source / 沒寫 PARsheet ID）一律沉底，不隨正反序跑到最前面
    if (!va !== !vb) return va ? -1 : 1;
    const cmp = sortKey === 'date' ? (vb - va) : String(vb).localeCompare(String(va));
    return (cmp * dir) || (b.hasDemo - a.hasDemo);
  });

  // 依 id 由大到小取最新的 3 款，掛上 NEW 緞帶
  const newIds = new Set(
    [...games].map(r => r.id).filter(Boolean).sort().reverse().slice(0, 3)
  );

  grid.innerHTML = sorted.map(g => {
      const gameBase = `${PAGES_BASE}/${SLOTS_PATH}/${encodeURIComponent(g.folderName)}`;
      const playUrl  = `${gameBase}/`;
      // 封面統一抓 Slots/其他/遊戲資源/<ID>.png
      const coverUrl = `${ASSETS_BASE}/${encodeURIComponent(g.id)}.png`;
      const desc = g.gameType || (g.hasDemo ? 'Video Slot' : 'Demo 製作中，敬請期待。 🚧');
      return `
        <div class="card ${g.hasDemo ? 'has-demo' : ''}">
          ${newIds.has(g.id) ? '<div class="ribbon"><span>NEW</span></div>' : ''}
          <div class="card-cover">
            <span class="ph">🎰</span>
            <img src="${coverUrl}" alt="${g.title}" loading="lazy"
                 onload="this.parentNode.querySelector('.ph')?.remove()"
                 onerror="this.remove()">
            ${!g.hasDemo ? '<div class="no-demo-overlay">尚無 Demo</div>' : ''}
          </div>
          <div class="card-body">
            <div class="card-title">${g.title}</div>
            <div class="card-desc">${desc}</div>
          </div>
          <div class="card-footer">
            <div class="btn btn-info is-static">遊戲資訊 <span class="ico">›</span></div>
            ${g.hasDemo
              ? `<button class="btn btn-play" type="button" data-play="${playUrl}" data-title="${g.title}">開始遊玩 <span class="ico">🎮</span></button>`
              : `<div class="btn disabled">製作中</div>`
            }
          </div>
        </div>`;
  }).join('');

  document.querySelectorAll('#sort-bar [data-key]').forEach(b => {
    b.classList.toggle('active', b.dataset.key === sortKey);
  });
  const dirBtn = document.getElementById('sort-dir');
  dirBtn.textContent = sortDesc ? '↓' : '↑';
  dirBtn.title = sortDesc
    ? (sortKey === 'date' ? '新 → 舊' : '大 → 小')
    : (sortKey === 'date' ? '舊 → 新' : '小 → 大');
}

function setSort(key, desc) {
  sortKey = key; sortDesc = desc;
  try { localStorage.setItem('demogame-sort', JSON.stringify({ key, desc })); } catch {}
  render();
}

document.querySelectorAll('#sort-bar [data-key]').forEach(btn => {
  btn.addEventListener('click', () => setSort(btn.dataset.key, sortDesc));
});
document.getElementById('sort-dir').addEventListener('click', () => setSort(sortKey, !sortDesc));

init();

// 有上一頁可回時才顯示返回鈕（直接開這個網址的人不會看到）
const heroBack = document.getElementById('hero-back');
if (history.length > 1) {
  heroBack.hidden = false;
  heroBack.addEventListener('click', () => history.back());
}

// ── 遊戲以 iframe 在同一頁開啟，並支援上一頁 / Esc 返回列表 ──
const player      = document.getElementById('player');
const playerFrame = document.getElementById('player-frame');
const playerTitle = document.getElementById('player-title');

function openGame(url, title) {
  playerFrame.src = url;
  playerTitle.textContent = title || '';
  player.classList.add('open');
  document.body.classList.add('playing');
  // 推一筆歷史，讓瀏覽器「上一頁」是關閉遊戲而不是離開本站
  history.pushState({ game: url }, '', '#play');
}

function closeGame(fromPop) {
  if (!player.classList.contains('open')) return;
  player.classList.remove('open');
  document.body.classList.remove('playing');
  playerFrame.src = 'about:blank';
  if (!fromPop && location.hash === '#play') history.back();
}

document.getElementById('game-grid').addEventListener('click', e => {
  const btn = e.target.closest('[data-play]');
  if (!btn) return;
  openGame(btn.dataset.play, btn.dataset.title);
});

document.getElementById('player-back').addEventListener('click', () => closeGame(false));
window.addEventListener('popstate', () => closeGame(true));
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeGame(false); });
</script>
</body>
</html>
