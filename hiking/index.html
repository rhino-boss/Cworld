<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>爬山 · Cworld</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d32020'/%3E%3Ctext x='32' y='46' font-family='Helvetica,Arial,sans-serif' font-size='46' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f7f7f5; --surface: #fff; --border: #e8e8e4;
      --text: #1a1a1a; --muted: #6b6b6b;
      --accent-dark: #1a4731; --accent-mid: #2d6a4f;
      --radius: 14px;
    }
    body { font-family: 'Helvetica Neue','PingFang TC','Microsoft JhengHei',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    nav { background: var(--accent-dark); padding: 0 32px; display: flex; align-items: center; gap: 8px; height: 52px; }
    nav a { color: rgba(255,255,255,.65); text-decoration: none; font-size: .85rem; }
    nav a:hover { color: #fff; }
    nav .sep { color: rgba(255,255,255,.3); font-size: .85rem; }
    nav .current { color: #fff; font-weight: 600; font-size: .85rem; }

    .hero { background: linear-gradient(135deg, var(--accent-dark), var(--accent-mid)); padding: 40px 48px 36px; color: #fff; }
    .hero h1 { font-size: 1.75rem; font-weight: 700; }
    .hero p { margin-top: 6px; font-size: .9rem; opacity: .7; }

    .container { max-width: 1100px; margin: 0 auto; padding: 36px 48px 80px; }

    .status-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; font-size: .82rem; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a8a50; flex-shrink: 0; }

    /* 數據總覽 */
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; margin-bottom: 36px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 20px; box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    .stat-num { font-size: 1.8rem; font-weight: 800; color: var(--accent-mid); font-variant-numeric: tabular-nums; }
    .stat-num .unit { font-size: .82rem; font-weight: 700; color: var(--muted); margin-left: 4px; }
    .stat-label { margin-top: 4px; font-size: .82rem; color: var(--muted); }

    .section-header { display: flex; align-items: center; justify-content: space-between; margin: 0 0 16px; }
    .section-title { font-size: 1.05rem; font-weight: 700; }
    .section-link { font-size: .82rem; color: var(--accent-mid); text-decoration: none; font-weight: 600; }
    .section-link:hover { text-decoration: underline; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }

    .card {
      position: relative; display: block; overflow: hidden;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      transition: box-shadow .2s, transform .2s;
      text-decoration: none; color: var(--text);
    }
    .card:hover { box-shadow: 0 8px 28px rgba(0,0,0,.13); transform: translateY(-3px); }
    .card-cover {
      height: 150px; background: linear-gradient(135deg, var(--accent-dark), var(--accent-mid));
      display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
    }
    .card-cover img { width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 16px 18px 18px; }
    .card-title { font-size: 1.05rem; font-weight: 700; }
    .card-meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: .74rem; color: var(--muted); font-weight: 600;
      background: var(--bg); border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 99px;
    }

    /* 卡片式入口（紀錄列表 / 制霸地圖 / 裝備清單） */
    .links { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .link-card {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; text-decoration: none; color: var(--text);
      font-size: .9rem; font-weight: 600;
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .link-card:hover { border-color: var(--accent-mid); box-shadow: 0 6px 18px rgba(0,0,0,.10); transform: translateY(-2px); }
    .link-card .arrow { color: var(--muted); }

    .empty {
      background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius);
      padding: 48px 24px; text-align: center; color: var(--muted); font-size: .88rem;
    }
    .empty .icon { font-size: 2.2rem; margin-bottom: 10px; }
    .empty a { color: var(--accent-mid); font-weight: 700; }

    .footer { padding: 28px 48px 40px; text-align: center; font-size: .78rem; color: var(--muted); }

    @media (max-width: 640px) {
      .hero { padding: 28px 24px; }
      .container { padding: 24px 20px 60px; }
      .grid, .links { grid-template-columns: 1fr; gap: 14px; }
      .stats { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="../index.html">Cworld</a>
  <span class="sep">/</span>
  <span class="current">爬山</span>
</nav>

<div class="hero">
  <h1>⛰️ 爬山</h1>
  <p>走過的山，一次一筆記下來</p>
</div>

<div class="container">
  <div class="status-bar">
    <div class="dot"></div>
    <span id="status-text">還沒有紀錄</span>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="stat-num"><span id="s-total">0</span><span class="unit">次</span></div><div class="stat-label">登山次數</div></div>
    <div class="stat-card"><div class="stat-num"><span id="s-gain">0</span><span class="unit">公尺</span></div><div class="stat-label">累計爬升</div></div>
    <div class="stat-card"><div class="stat-num"><span id="s-dist">0</span><span class="unit">公里</span></div><div class="stat-label">總距離</div></div>
    <div class="stat-card"><div class="stat-num"><span id="s-100">0</span><span class="unit">座</span></div><div class="stat-label">百岳完成</div></div>
  </div>

  <div class="section-header">
    <span class="section-title">最近紀錄</span>
    <a class="section-link" href="records.html">查看全部 →</a>
  </div>
  <div id="recentCards">
    <div class="empty"><div class="icon">🏔</div><p>還沒有紀錄，<a href="records.html">前往新增</a>第一筆吧！</p></div>
  </div>

  <div class="section-header" style="margin-top:40px;"><span class="section-title">其他頁面</span></div>
  <div class="links">
    <a class="link-card" href="records.html">📋 紀錄列表 <span class="arrow">→</span></a>
    <a class="link-card" href="peaks.html">🗺 百岳制霸地圖 <span class="arrow">→</span></a>
    <a class="link-card" href="peaks-small.html">🗺 小百岳制霸地圖 <span class="arrow">→</span></a>
    <a class="link-card" href="peaks-285.html">🗺 285峰制霸地圖 <span class="arrow">→</span></a>
    <a class="link-card" href="gear.html">🎒 裝備清單 <span class="arrow">→</span></a>
  </div>
</div>

<div class="footer">© 2026 Cworld · 爬山紀錄</div>

<script src="peaks-data.js"></script>
<script src="sync.js"></script>
<script>
function renderHome() {
  const records = JSON.parse(localStorage.getItem('hikeRecords') || '[]');

  const totalGain = records.reduce((s, r) => s + (Number(r.gain) || 0), 0);
  const totalDist = records.reduce((s, r) => s + (Number(r.distance) || 0), 0);
  document.getElementById('s-total').textContent = records.length;
  document.getElementById('s-gain').textContent = totalGain.toLocaleString();
  document.getElementById('s-dist').textContent = totalDist.toFixed(1);
  // 百岳完成數（比對規則見 peaks-data.js）
  document.getElementById('s-100').textContent = completedPeakSet(records).size;

  document.getElementById('status-text').textContent = records.length
    ? `共 ${records.length} 筆紀錄，累計爬升 ${totalGain.toLocaleString()} 公尺`
    : '還沒有紀錄';

  const recent = [...records].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);
  if (recent.length) {
    document.getElementById('recentCards').innerHTML = `
      <div class="grid">
        ${recent.map(r => `
          <a class="card" href="records.html">
            <div class="card-cover">${
              r.photos && r.photos.length
                ? `<img src="${r.photos[0]}" alt="${r.name}" />`
                : (r.emoji || '🏔')
            }</div>
            <div class="card-body">
              <div class="card-title">${r.name}</div>
              <div class="card-meta">
                <span class="chip">📅 ${r.date}</span>
                ${r.distance ? `<span class="chip">📏 ${Number(r.distance).toFixed(1)} km</span>` : ''}
                ${r.gain ? `<span class="chip">⬆️ ${Number(r.gain).toLocaleString()} m</span>` : ''}
                ${r.category ? `<span class="chip">${r.category}</span>` : ''}
                ${r.weight ? `<span class="chip">🎒 ${r.weight}kg</span>` : ''}
                ${r.photos && r.photos.length > 1 ? `<span class="chip">📷 ${r.photos.length}</span>` : ''}
              </div>
            </div>
          </a>`).join('')}
      </div>`;
  }
}

renderHome();
HikeSync.onReady(renderHome);   // 雲端資料抓回來後再畫一次
</script>
</body>
</html>
