<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>紀錄列表 — 我的登山紀錄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .search-bar {
      display: flex; align-items: center; gap: 10px;
      background: var(--white); border: 1.5px solid var(--gray-300);
      border-radius: var(--radius-sm); padding: 8px 14px; margin-bottom: 16px;
      transition: border-color var(--transition);
    }
    .search-bar:focus-within { border-color: var(--green-main); }
    .search-bar input {
      border: none; outline: none; font: inherit; font-size: .9rem;
      color: var(--gray-900); flex: 1; background: transparent;
    }
    .search-bar input::placeholder { color: var(--gray-500); }
    .result-count { font-size: .85rem; color: var(--gray-500); margin-bottom: 16px; }

    /* GPX badge */
    .gpx-badge {
      font-size: .72rem; padding: 2px 8px; border-radius: 999px;
      background: #e0f2fe; color: #0369a1; font-weight: 600;
    }

    /* GPX 偵測到的山頭 */
    .peak-detect {
      display: none; margin-top: 10px; padding: 12px 14px;
      background: #f0f9ff; border: 1px solid #bae6fd;
      border-radius: var(--radius-sm);
    }
    .peak-detect.show { display: block; }
    .peak-detect-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; flex-wrap: wrap; margin-bottom: 10px;
      font-size: .82rem; font-weight: 600; color: #0369a1;
    }
    .peak-detect-head small { font-weight: 400; color: var(--gray-500); margin-left: 6px; }
    .peak-detect-head label { display: flex; align-items: center; gap: 6px; font-weight: 400; color: var(--gray-500); }
    .peak-detect-head select { font: inherit; font-size: .78rem; padding: 3px 6px; border: 1px solid var(--gray-300); border-radius: 6px; }
    .peak-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .peak-chip {
      font: inherit; font-size: .78rem; cursor: pointer;
      padding: 4px 11px; border-radius: 999px;
      border: 1.5px solid var(--gray-300); background: var(--white);
      color: var(--gray-500); transition: all var(--transition);
    }
    .peak-chip .alt { font-size: .7rem; opacity: .75; margin-left: 4px; }
    .peak-chip.on { border-color: var(--green-main); background: var(--green-pale); color: var(--green-dark); font-weight: 600; }
    .peak-detect-empty { font-size: .8rem; color: var(--gray-500); }

    /* 由 GPX 推導出來的欄位（僅顯示，不需填寫） */
    .derived-row {
      display: flex; gap: 14px; flex-wrap: wrap;
      margin-top: 10px; padding-top: 10px;
      border-top: 1px dashed #bae6fd;
      font-size: .8rem; color: var(--gray-500);
    }
    .derived-row:empty { display: none; }
    .derived-item strong { color: var(--green-dark); font-weight: 600; margin-left: 3px; }

    /* 卡片上的山頭標籤 */
    .card-peaks { display: flex; gap: 4px; flex-wrap: wrap; }
    .card-peak {
      font-size: .72rem; padding: 2px 8px; border-radius: 999px;
      background: var(--green-pale); color: var(--green-dark); font-weight: 600;
      display: inline-flex; align-items: center; gap: 4px;
    }
    /* 百岳排名（依海拔），取代原本的山岳 emoji */
    .card-peak .peak-no {
      font-size: .66rem; font-weight: 700; letter-spacing: .02em;
      padding: 1px 5px; border-radius: 999px;
      background: var(--green-main); color: var(--white);
    }

    /* 卡片操作按鈕（滑過才出現） */
    .record-card { position: relative; cursor: pointer; }
    .card-actions {
      position: absolute; top: 8px; right: 8px; display: flex; gap: 6px;
      opacity: 0; transition: opacity var(--transition);
    }
    .record-card:hover .card-actions, .card-actions:focus-within { opacity: 1; }
    .card-act-btn {
      width: 28px; height: 28px; border: none; border-radius: 50%;
      cursor: pointer; font-size: .85rem; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.94); color: var(--gray-900);
      box-shadow: var(--shadow-sm); transition: background var(--transition), color var(--transition);
    }
    .card-act-btn:hover { background: var(--green-main); color: var(--white); }
    .card-act-btn.danger:hover { background: #dc2626; color: var(--white); }

    /* 詳情視窗 */
    .detail-sub { font-size: .85rem; color: var(--gray-500); margin: -12px 0 18px; }
    .detail-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px; margin-bottom: 20px;
    }
    .detail-cell { background: var(--green-bg); border-radius: var(--radius-sm); padding: 10px 12px; }
    .detail-cell .k { display: block; font-size: .72rem; color: var(--gray-500); margin-bottom: 3px; }
    .detail-cell .v { font-size: .95rem; font-weight: 700; color: var(--green-dark); }
    .detail-section { margin-bottom: 20px; }
    .detail-section h3 { font-size: .8rem; font-weight: 600; color: var(--gray-500); margin-bottom: 8px; }
    .detail-note { font-size: .88rem; line-height: 1.75; color: var(--gray-900); white-space: pre-wrap; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
    .photo-grid img {
      width: 100%; height: 104px; object-fit: cover;
      border-radius: var(--radius-sm); cursor: zoom-in;
    }

    /* 照片放大 */
    #lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 1000;
      display: none; align-items: center; justify-content: center;
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 8px; }
    #lightbox .close { position: absolute; top: 16px; right: 24px; color: #fff; font-size: 1.7rem; cursor: pointer; }

    /* 編輯視窗裡可移除的照片 / 山頭 */
    .edit-photos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .edit-photo { position: relative; width: 64px; height: 64px; }
    .edit-photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
    .edit-photo button {
      position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
      border: none; border-radius: 50%; background: #dc2626; color: #fff;
      font-size: .62rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .chip-removable {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .78rem; font-weight: 600; padding: 4px 10px; border-radius: 999px;
      background: var(--green-pale); color: var(--green-dark);
    }
    .chip-removable button {
      border: none; background: transparent; color: var(--green-main);
      cursor: pointer; font-size: .8rem; line-height: 1; padding: 0;
    }
    .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .hint { font-size: .78rem; color: var(--gray-500); margin-top: 6px; }
  </style>
</head>

<script src="peaks-data.js"></script>
<script>
// ── State ──────────────────────────────────────────
let records = JSON.parse(localStorage.getItem('hikeRecords') || '[]');
let currentTab = 'all';
let photoDataURLs = []; // base64 photos for current form

// GPX 解析結果（供調整判定範圍時重算山頭，不必重讀檔案）
let gpxPoints = [];      // [{lat, lon, ele, time}]
let gpxWptNames = [];    // GPX 內的航點名稱
let gpxStats = null;     // {distKm, gainM, lossM, maxAlt, durationH, startDate, dayCount, trkName, fileName}
let detectedPeaks = [];  // detectPeaksNearTrack() 的結果
let selectedPeaks = new Set();
// 表單只收 GPX / 負重 / 照片 / 心得，其餘欄位都由 GPX 推導後存進紀錄
let derived = { name: '', date: '', days: '', category: '' };

// ── Modal ──────────────────────────────────────────
function openAddModal() {
  resetForm();
  document.getElementById('addModal').classList.add('open');
}
function closeAddModal() {
  document.getElementById('addModal').classList.remove('open');
}
function resetForm() {
  ['f-weight','f-note','f-gpx','f-photos'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('gpxResult').classList.remove('show');
  document.getElementById('peakDetect').classList.remove('show');
  document.getElementById('peakChips').innerHTML = '';
  document.getElementById('derivedRow').innerHTML = '';
  document.getElementById('peakThreshold').value = '400';
  document.getElementById('photoPreviewRow').innerHTML = '';
  photoDataURLs = [];
  gpxPoints = []; gpxWptNames = []; gpxStats = null;
  detectedPeaks = []; selectedPeaks = new Set();
  derived = { name: '', date: '', days: '', category: '' };
}

// ── GPX Parsing ────────────────────────────────────
// 純解析：吃 GPX 文字，吐出軌跡點與統計，新增與編輯兩邊共用
function analyzeGpx(text, fileName) {
  const xml = new DOMParser().parseFromString(text, 'text/xml');
  if (xml.querySelector('parsererror')) throw new Error('檔案格式不是有效的 XML');

  // 逐段（trkseg）讀點，段與段之間不累加距離，避免斷點造成假距離
  const segs = [...xml.querySelectorAll('trkseg')];
  const segments = segs.length
    ? segs.map(s => [...s.querySelectorAll('trkpt')])
    : [[...xml.querySelectorAll('trkpt, rtept')]]; // 只有路線（route）時的退路

  let dist = 0, gain = 0, loss = 0, maxAlt = -Infinity;
  const points = [];

  segments.forEach(pts => {
    let prev = null;       // 上一個點（算距離）
    let refEle = null;     // 爬升門檻的基準高度（濾掉 GPS 高度雜訊）
    pts.forEach(pt => {
      const lat = parseFloat(pt.getAttribute('lat'));
      const lon = parseFloat(pt.getAttribute('lon'));
      if (!isFinite(lat) || !isFinite(lon)) return;
      const eleEl = pt.querySelector('ele');
      const ele = eleEl ? parseFloat(eleEl.textContent) : null;
      const timeEl = pt.querySelector('time');
      const time = timeEl ? new Date(timeEl.textContent) : null;
      const p = { lat, lon, ele, time: (time && !isNaN(time)) ? time : null };

      if (prev) dist += haversine(prev.lat, prev.lon, lat, lon);
      if (ele !== null && isFinite(ele)) {
        if (ele > maxAlt) maxAlt = ele;
        if (refEle === null) refEle = ele;
        const diff = ele - refEle;
        // 只在累積變化超過 3 公尺才計入，避免 GPS 抖動把爬升灌水
        if (diff > 3) { gain += diff; refEle = ele; }
        else if (diff < -3) { loss += -diff; refEle = ele; }
      }
      prev = p;
      points.push(p);
    });
  });

  if (!points.length) throw new Error('GPX 檔案中找不到軌跡點');

  // 時間：起訖、耗時、跨越天數
  const times = points.map(p => p.time).filter(Boolean);
  const t0 = times[0] || null, t1 = times[times.length - 1] || null;
  let durationH = null, startDate = '', dayCount = 0;
  if (t0) {
    startDate = toDateInputValue(t0);
    if (t1) {
      durationH = (t1 - t0) / 3600000;
      const d0 = new Date(t0.getFullYear(), t0.getMonth(), t0.getDate());
      const d1 = new Date(t1.getFullYear(), t1.getMonth(), t1.getDate());
      dayCount = Math.round((d1 - d0) / 86400000) + 1;
    }
  }

  const trkNameEl = xml.querySelector('trk > name');
  return {
    points,
    // 航點名稱（有些 GPX 會把山頭放在 <wpt>）
    wptNames: [...xml.querySelectorAll('wpt > name')].map(n => n.textContent.trim()).filter(Boolean),
    stats: {
      distKm: (dist / 1000).toFixed(2),
      gainM: Math.round(gain),
      lossM: Math.round(loss),
      maxAlt: isFinite(maxAlt) ? Math.round(maxAlt) : null,
      durationH, startDate, dayCount,
      trkName: trkNameEl ? trkNameEl.textContent.trim() : '',
      fileName,
    },
  };
}

function parseGPX(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const res = analyzeGpx(e.target.result, file.name);
      gpxPoints = res.points;
      gpxWptNames = res.wptNames;
      gpxStats = res.stats;

      // 摘要列
      document.getElementById('gpx-dist').textContent = gpxStats.distKm;
      document.getElementById('gpx-gain').textContent = gpxStats.gainM.toLocaleString();
      document.getElementById('gpx-loss').textContent = gpxStats.lossM.toLocaleString();
      document.getElementById('gpx-maxalt').textContent = gpxStats.maxAlt !== null ? gpxStats.maxAlt.toLocaleString() : '—';
      document.getElementById('gpx-dur').textContent = gpxStats.durationH !== null ? formatDuration(gpxStats.durationH) : '—';
      document.getElementById('gpxResult').classList.add('show');

      // 日期 / 天數（沒有時間戳的 GPX 就退回檔案修改日）
      derived.date = gpxStats.startDate || toDateInputValue(new Date(file.lastModified));
      derived.days = gpxStats.dayCount > 1 ? `${gpxStats.dayCount}天${gpxStats.dayCount - 1}夜` : '當日來回';

      // 偵測山頭 → 決定紀錄名稱與分類
      redetectPeaks();
    } catch(err) {
      alert('GPX 解析失敗：' + err.message);
    }
  };
  reader.readAsText(file);
}

// 依目前的判定範圍重新比對百岳座標
function redetectPeaks() {
  if (!gpxPoints.length) return;
  const th = Number(document.getElementById('peakThreshold').value);
  detectedPeaks = detectPeaksNearTrack(gpxPoints, th);

  // GPX 航點名稱裡有百岳山名的，也一併列入候選
  gpxWptNames.forEach(n => {
    PEAKS.forEach(p => {
      if (n.includes(p.name) && !detectedPeaks.some(d => d.name === p.name)) {
        detectedPeaks.push({ rank: p.rank, name: p.name, alt: p.alt, distM: null, time: null, viaWpt: true });
      }
    });
  });

  selectedPeaks = new Set(detectedPeaks.map(d => d.name));
  renderPeakChips();
  updateDerived();
}

function renderPeakChips() {
  const box = document.getElementById('peakDetect');
  const chips = document.getElementById('peakChips');
  box.classList.add('show');
  if (!detectedPeaks.length) {
    chips.innerHTML = `<span class="peak-detect-empty">這條軌跡沒有經過百岳（可放寬判定範圍再試）— 紀錄會用軌跡名稱命名</span>`;
    return;
  }
  chips.innerHTML = detectedPeaks.map(p => `
    <button type="button" class="peak-chip ${selectedPeaks.has(p.name) ? 'on' : ''}"
      onclick="togglePeak('${p.name}')"
      title="${p.viaWpt ? 'GPX 航點名稱' : '最近距離 ' + p.distM + ' m'}">
      ${p.name}<span class="alt">${p.alt.toLocaleString()}m</span>
    </button>`).join('');
}

function togglePeak(name) {
  if (selectedPeaks.has(name)) selectedPeaks.delete(name);
  else selectedPeaks.add(name);
  renderPeakChips();
  updateDerived();
}

// 由 GPX + 選中的山頭推導紀錄名稱與分類，並顯示出來讓人確認
function updateDerived() {
  if (!gpxStats) return;
  const names = detectedPeaks.filter(p => selectedPeaks.has(p.name)).map(p => p.name);

  // 名稱：選中的山頭 → 軌跡名稱 → 檔名
  derived.name = names.join('、')
    || gpxStats.trkName
    || gpxStats.fileName.replace(/\.gpx$/i, '');

  // 分類：有百岳就是百岳，否則按最高點粗分（慣例：郊山 <1000 m、中級山 1000 m 以上）
  derived.category = names.length ? '百岳'
    : (gpxStats.maxAlt >= 1000 ? '中級山' : '郊山');

  document.getElementById('derivedRow').innerHTML = `
    <span class="derived-item">紀錄名稱 <strong>${derived.name}</strong></span>
    <span class="derived-item">日期 <strong>${derived.date}</strong></span>
    <span class="derived-item">天數 <strong>${derived.days}</strong></span>
    <span class="derived-item">分類 <strong>${derived.category}</strong></span>`;
}

function toDateInputValue(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function formatDuration(hours) {
  const h = Math.floor(hours);
  const m = Math.round((hours - h) * 60);
  return h >= 24 ? `${Math.floor(h/24)}天${h%24}小時` : (h ? `${h}小時${m}分` : `${m}分`);
}

function haversine(lat1, lon1, lat2, lon2) {
  return haversineM(lat1, lon1, lat2, lon2); // 共用 peaks-data.js 的實作
}

// ── Photo Preview ──────────────────────────────────
// 上傳後先縮圖再轉 base64，否則幾張原圖就會撐爆 localStorage（約 5MB）
function previewPhotos(input) {
  const files = [...input.files].slice(0, 9);
  const row = document.getElementById('photoPreviewRow');
  row.innerHTML = files.length ? '<span style="font-size:.8rem;color:var(--gray-500)">處理中…</span>' : '';
  photoDataURLs = [];
  Promise.all(files.map(f => compressImage(f))).then(urls => {
    photoDataURLs = urls.filter(Boolean); // 保持原本選取順序
    row.innerHTML = photoDataURLs
      .map(u => `<img src="${u}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;" />`)
      .join('');
  });
}

function compressImage(file, maxDim = 1400, quality = 0.72) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => resolve(null);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

// ── Save Record ────────────────────────────────────
function saveRecord() {
  if (!gpxStats) { alert('請先上傳 GPX — 日期、山頭、距離、爬升都從裡面取得'); return; }

  const emojis = ['🏔','🌲','🌿','🌄','❄️','🗻','⛰️','🌅'];
  const record = {
    id: Date.now(),
    // 以下由 GPX 推導（見 updateDerived）
    name: derived.name,
    date: derived.date,
    category: derived.category,
    days: derived.days,
    distance: gpxStats.distKm,
    gain: gpxStats.gainM,
    peaks: [...selectedPeaks],
    loss: gpxStats.lossM,
    maxAlt: gpxStats.maxAlt,
    duration: gpxStats.durationH !== null ? formatDuration(gpxStats.durationH) : undefined,
    gpxFile: gpxStats.fileName,
    // 手動輸入的部分
    weight: document.getElementById('f-weight').value,
    note: document.getElementById('f-note').value.trim(),
    photos: photoDataURLs.slice(0, 9), // limit storage
    emoji: emojis[Math.floor(Math.random() * emojis.length)],
  };

  const backup = records;
  records = [record, ...records];
  try {
    localStorage.setItem('hikeRecords', JSON.stringify(records));
  } catch (err) {
    records = backup;
    alert('儲存失敗：瀏覽器儲存空間已滿（照片太多或太大）。請減少照片張數後再試。');
    return;
  }
  closeAddModal();
  renderAll();
}

// ── Delete Record ──────────────────────────────────
function deleteRecord(id, e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  if (!confirm('確定刪除這筆紀錄？')) return;
  records = records.filter(r => r.id !== id);
  localStorage.setItem('hikeRecords', JSON.stringify(records));
  closeDetail();
  renderAll();
}

// ── Detail：點開卡片看完整資訊 ─────────────────────
function openDetail(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;

  const cell = (k, v) => v || v === 0
    ? `<div class="detail-cell"><span class="k">${k}</span><span class="v">${v}</span></div>` : '';

  document.getElementById('detailBody').innerHTML = `
    <h2>${r.name}</h2>
    <p class="detail-sub">${[r.date, r.days, r.category].filter(Boolean).join(' · ')}</p>

    <div class="detail-grid">
      ${cell('距離', r.distance ? `${Number(r.distance).toFixed(2)} km` : '')}
      ${cell('總爬升', r.gain ? `${Number(r.gain).toLocaleString()} m` : '')}
      ${cell('總下降', r.loss ? `${Number(r.loss).toLocaleString()} m` : '')}
      ${cell('最高點', r.maxAlt ? `${Number(r.maxAlt).toLocaleString()} m` : '')}
      ${cell('耗時', r.duration)}
      ${cell('背包負重', r.weight ? `${r.weight} kg` : '')}
      ${cell('地點', r.location)}
    </div>

    ${r.peaks && r.peaks.length ? `
      <div class="detail-section">
        <h3>走過的山頭（${r.peaks.length}）</h3>
        <div class="card-peaks">
          ${r.peaks.map(p => {
            const rank = peakRankOf(p);
            const alt = PEAKS.find(x => x.name === p);
            return `<span class="card-peak">${rank ? `<span class="peak-no">NO.${rank}</span>` : '🏔'} ${p}${alt ? ` <span style="font-weight:400;opacity:.7">${alt.alt.toLocaleString()}m</span>` : ''}</span>`;
          }).join('')}
        </div>
      </div>` : ''}

    ${r.photos && r.photos.length ? `
      <div class="detail-section">
        <h3>照片（${r.photos.length}）</h3>
        <div class="photo-grid">
          ${r.photos.map(p => `<img src="${p}" onclick="openLightbox(this.src)" />`).join('')}
        </div>
      </div>` : ''}

    ${r.note ? `
      <div class="detail-section">
        <h3>備註 / 心得</h3>
        <p class="detail-note">${escapeHtml(r.note)}</p>
      </div>` : ''}

    ${r.gpxFile ? `<p class="hint">📂 ${r.gpxFile}</p>` : ''}

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="deleteRecord(${r.id})">刪除</button>
      <button class="btn btn-outline" onclick="closeDetail()">關閉</button>
      <button class="btn btn-primary" onclick="openEditModal(${r.id})">✏️ 編輯</button>
    </div>`;

  document.getElementById('detailModal').classList.add('open');
}
function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
}

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }

// ── Edit ───────────────────────────────────────────
let editing = null; // {id, photos: [], peaks: [], gpx: {...} | null}

function openEditModal(id, e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  const r = records.find(x => x.id === id);
  if (!r) return;

  editing = { id, photos: [...(r.photos || [])], peaks: [...(r.peaks || [])], gpx: null };

  document.getElementById('e-name').value = r.name || '';
  document.getElementById('e-date').value = r.date || '';
  document.getElementById('e-cat').value = r.category || '其他';
  document.getElementById('e-days').value = r.days || '';
  document.getElementById('e-dist').value = r.distance || '';
  document.getElementById('e-gain').value = r.gain || '';
  document.getElementById('e-weight').value = r.weight || '';
  document.getElementById('e-note').value = r.note || '';
  document.getElementById('e-gpx').value = '';
  document.getElementById('e-photo-add').value = '';
  document.getElementById('e-gpx-hint').textContent = r.gpxFile ? `目前：${r.gpxFile}` : '這筆紀錄沒有附 GPX';
  renderEditPeaks();
  renderEditPhotos();

  closeDetail();
  document.getElementById('editModal').classList.add('open');
}
function closeEditModal() {
  document.getElementById('editModal').classList.remove('open');
  editing = null;
}

function renderEditPeaks() {
  const box = document.getElementById('e-peaks');
  if (!editing.peaks.length) {
    box.innerHTML = `<span class="hint">沒有山頭 — 重新上傳 GPX 可自動偵測</span>`;
    return;
  }
  box.innerHTML = editing.peaks.map(p => {
    const rank = peakRankOf(p);
    return `<span class="chip-removable">${rank ? `<span class="peak-no">NO.${rank}</span>` : '🏔'} ${p}
      <button type="button" onclick="removeEditPeak('${p}')" title="移除">✕</button></span>`;
  }).join('');
}
function removeEditPeak(name) {
  editing.peaks = editing.peaks.filter(p => p !== name);
  renderEditPeaks();
}

function renderEditPhotos() {
  const box = document.getElementById('e-photos');
  box.innerHTML = editing.photos.length
    ? editing.photos.map((p, i) => `
        <div class="edit-photo">
          <img src="${p}" onclick="openLightbox(this.src)" />
          <button type="button" onclick="removeEditPhoto(${i})" title="移除">✕</button>
        </div>`).join('')
    : `<span class="hint">還沒有照片</span>`;
}
function removeEditPhoto(i) {
  editing.photos.splice(i, 1);
  renderEditPhotos();
}
function addEditPhotos(input) {
  const files = [...input.files];
  if (!files.length) return;
  Promise.all(files.map(f => compressImage(f))).then(urls => {
    editing.photos = [...editing.photos, ...urls.filter(Boolean)].slice(0, 9);
    input.value = '';
    renderEditPhotos();
  });
}

// 編輯時重新上傳 GPX：重算日期 / 天數 / 距離 / 爬升 / 山頭
function reparseGpxForEdit(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const res = analyzeGpx(e.target.result, file.name);
      const s = res.stats;
      editing.gpx = s;
      editing.peaks = detectPeaksNearTrack(res.points, 400).map(p => p.name);

      document.getElementById('e-date').value = s.startDate || toDateInputValue(new Date(file.lastModified));
      document.getElementById('e-days').value = s.dayCount > 1 ? `${s.dayCount}天${s.dayCount - 1}夜` : '當日來回';
      document.getElementById('e-dist').value = s.distKm;
      document.getElementById('e-gain').value = s.gainM;
      document.getElementById('e-gpx-hint').textContent =
        `已重算：${s.fileName}｜下降 ${s.lossM.toLocaleString()} m·最高點 ${s.maxAlt !== null ? s.maxAlt.toLocaleString() + ' m' : '—'}` +
        (s.durationH !== null ? `·耗時 ${formatDuration(s.durationH)}` : '');
      renderEditPeaks();
    } catch (err) {
      alert('GPX 解析失敗：' + err.message);
    }
  };
  reader.readAsText(file);
}

function saveEdit() {
  const name = document.getElementById('e-name').value.trim();
  const date = document.getElementById('e-date').value;
  if (!name || !date) { alert('紀錄名稱和日期不能空白'); return; }

  const idx = records.findIndex(r => r.id === editing.id);
  if (idx < 0) return;
  const old = records[idx];
  const s = editing.gpx;

  const updated = {
    ...old,
    name, date,
    category: document.getElementById('e-cat').value,
    days: document.getElementById('e-days').value.trim(),
    distance: document.getElementById('e-dist').value,
    gain: document.getElementById('e-gain').value,
    weight: document.getElementById('e-weight').value,
    note: document.getElementById('e-note').value.trim(),
    photos: editing.photos,
    peaks: editing.peaks,
    // 只有重新上傳 GPX 時才覆寫這幾項
    loss: s ? s.lossM : old.loss,
    maxAlt: s ? s.maxAlt : old.maxAlt,
    duration: s ? (s.durationH !== null ? formatDuration(s.durationH) : undefined) : old.duration,
    gpxFile: s ? s.fileName : old.gpxFile,
  };

  const backup = records;
  records = records.map((r, i) => i === idx ? updated : r);
  try {
    localStorage.setItem('hikeRecords', JSON.stringify(records));
  } catch (err) {
    records = backup;
    alert('儲存失敗：瀏覽器儲存空間已滿（照片太多或太大）。請減少照片張數後再試。');
    return;
  }
  closeEditModal();
  renderAll();
}

// ── Render ─────────────────────────────────────────
function switchTab(btn, cat) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTab = cat;
  renderCards();
}

function renderAll() {
  renderYearFilter();
  renderCards();
  document.getElementById('totalCount').textContent = `共 ${records.length} 筆紀錄`;
}

function renderYearFilter() {
  const years = [...new Set(records.map(r => r.date.slice(0,4)))].sort((a,b)=>b-a);
  const row = document.getElementById('yearFilter');
  row.innerHTML = `<button class="filter-pill active" onclick="setYear(this,'all')">全部時間</button>` +
    years.map(y => `<button class="filter-pill" onclick="setYear(this,'${y}')">${y}</button>`).join('');
}

let currentYear = 'all';
function setYear(btn, y) {
  document.querySelectorAll('#yearFilter .filter-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentYear = y;
  renderCards();
}

function renderCards() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let filtered = records.filter(r => {
    const catOk = currentTab === 'all' || r.category === currentTab;
    const yearOk = currentYear === 'all' || r.date.startsWith(currentYear);
    const textOk = !q || r.name.toLowerCase().includes(q)
      || (r.location||'').toLowerCase().includes(q)
      || (r.peaks||[]).some(p => p.toLowerCase().includes(q));
    return catOk && yearOk && textOk;
  });

  const grid = document.getElementById('cardGrid');
  document.getElementById('resultCount').textContent = `顯示 ${filtered.length} 筆`;

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="icon">🔍</div><p>${records.length ? '沒有符合條件的紀錄' : '還沒有紀錄，點右上角「新增紀錄」開始吧！'}</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(r => `
    <div class="record-card" onclick="openDetail(${r.id})" title="點開看完整資訊">
      <div class="record-card-img">${
        r.photos && r.photos.length
          ? `<img src="${r.photos[0]}" style="width:100%;height:160px;object-fit:cover;" />`
          : r.emoji || '🏔'
      }</div>
      <div class="card-actions">
        <button class="card-act-btn" onclick="openEditModal(${r.id}, event)" title="編輯">✏️</button>
        <button class="card-act-btn danger" onclick="deleteRecord(${r.id}, event)" title="刪除">✕</button>
      </div>
      <div class="record-card-body">
        <div class="record-card-title">${r.name}</div>
        <div class="record-card-meta">
          <span class="meta-chip">📅 ${r.date}</span>
          ${r.days ? `<span class="meta-chip">⏱ ${r.days}</span>` : ''}
          ${r.location ? `<span class="meta-chip">📍 ${r.location}</span>` : ''}
        </div>
        <div class="record-card-meta" style="margin-top:4px;">
          ${r.distance ? `<span class="meta-chip">📏 ${Number(r.distance).toFixed(1)} km</span>` : ''}
          ${r.gain ? `<span class="meta-chip">⬆️ ${Number(r.gain).toLocaleString()} m</span>` : ''}
          ${r.maxAlt ? `<span class="meta-chip">🗻 ${Number(r.maxAlt).toLocaleString()} m</span>` : ''}
          ${r.duration ? `<span class="meta-chip">⌛ ${r.duration}</span>` : ''}
          ${r.weight ? `<span class="meta-chip">🎒 ${r.weight} kg</span>` : ''}
        </div>
        ${r.peaks && r.peaks.length ? `
          <div class="card-peaks">
            ${r.peaks.map(p => {
              const rank = peakRankOf(p);
              return `<span class="card-peak">${rank ? `<span class="peak-no">NO.${rank}</span>` : '🏔'} ${p}</span>`;
            }).join('')}
          </div>` : ''}
        <div class="record-card-tags">
          ${r.category ? `<span class="tag">${r.category}</span>` : ''}
          ${r.photos && r.photos.length > 1 ? `<span class="gpx-badge">📷 ${r.photos.length}</span>` : ''}
          ${r.gpxFile ? `<span class="gpx-badge">GPX</span>` : ''}
        </div>
        ${r.note ? `<p style="font-size:.8rem;color:var(--gray-500);margin-top:8px;line-height:1.5;">${r.note.slice(0,80)}${r.note.length>80?'…':''}</p>` : ''}
      </div>
    </div>
  `).join('');
}

// Init
renderAll();
</script>
</body>
</html>
