    .card-delete-btn:hover { background: #b91c1c; }

<script src="peaks-data.js"></script>
<script>
// ── State ──────────────────────────────────────────
let records = JSON.parse(localStorage.getItem('hikeRecords') || '[]');
let currentTab = 'all';
let photoDataURLs = []; // base64 photos for current form

// GPX 解析結果（供調整判定範圍時重算山頭，不必重讀檔案）
let gpxPoints = [];      // [{lat, lon, ele, time}]
let gpxWptNames = [];    // GPX 內的航點名稱
let gpxStats = null;     // {distKm, gainM, lossM, maxAlt, durationH, startDate, dayCount, trkName, fileName}
let detectedPeaks = [];  // detectPeaksNearTrack() 的結果
let selectedPeaks = new Set();
// 表單只收 GPX / 負重 / 照片 / 心得，其餘欄位都由 GPX 推導後存進紀錄
let derived = { name: '', date: '', days: '', category: '' };

// ── Modal ──────────────────────────────────────────
function openAddModal() {
  resetForm();
  document.getElementById('addModal').classList.add('open');
}
function closeAddModal() {
  document.getElementById('addModal').classList.remove('open');
}
function resetForm() {
  ['f-weight','f-note','f-gpx','f-photos'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('gpxResult').classList.remove('show');
  document.getElementById('peakDetect').classList.remove('show');
  document.getElementById('peakChips').innerHTML = '';
  document.getElementById('derivedRow').innerHTML = '';
  document.getElementById('peakThreshold').value = '400';
  document.getElementById('photoPreviewRow').innerHTML = '';
  photoDataURLs = [];
  gpxPoints = []; gpxWptNames = []; gpxStats = null;
  detectedPeaks = []; selectedPeaks = new Set();
  derived = { name: '', date: '', days: '', category: '' };
}

// ── GPX Parsing ────────────────────────────────────
function parseGPX(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const xml = new DOMParser().parseFromString(e.target.result, 'text/xml');
      if (xml.querySelector('parsererror')) throw new Error('檔案格式不是有效的 XML');

      // 逐段（trkseg）讀點，段與段之間不累加距離，避免斷點造成假距離
      const segs = [...xml.querySelectorAll('trkseg')];
      const segments = segs.length
        ? segs.map(s => [...s.querySelectorAll('trkpt')])
        : [[...xml.querySelectorAll('trkpt, rtept')]]; // 只有路線（route）時的退路

      let dist = 0, gain = 0, loss = 0;
      let maxAlt = -Infinity, minAlt = Infinity;
      const allPoints = [];

      segments.forEach(pts => {
        let prev = null;       // 上一個點（算距離）
        let refEle = null;     // 爬升門檻的基準高度（濾掉 GPS 高度雜訊）
        pts.forEach(pt => {
          const lat = parseFloat(pt.getAttribute('lat'));
          const lon = parseFloat(pt.getAttribute('lon'));
          if (!isFinite(lat) || !isFinite(lon)) return;
          const eleEl = pt.querySelector('ele');
          const ele = eleEl ? parseFloat(eleEl.textContent) : null;
          const timeEl = pt.querySelector('time');
          const time = timeEl ? new Date(timeEl.textContent) : null;
          const p = { lat, lon, ele, time: (time && !isNaN(time)) ? time : null };

          if (prev) dist += haversine(prev.lat, prev.lon, lat, lon);
          if (ele !== null && isFinite(ele)) {
            if (ele > maxAlt) maxAlt = ele;
            if (ele < minAlt) minAlt = ele;
            if (refEle === null) refEle = ele;
            const diff = ele - refEle;
            // 只在累積變化超過 3 公尺才計入，避免 GPS 抖動把爬升灌水
            if (diff > 3) { gain += diff; refEle = ele; }
            else if (diff < -3) { loss += -diff; refEle = ele; }
          }
          prev = p;
          allPoints.push(p);
        });
      });

      if (!allPoints.length) { alert('GPX 檔案中找不到軌跡點'); return; }

      // 航點名稱（有些 GPX 會把山頭放在 <wpt>）
      gpxWptNames = [...xml.querySelectorAll('wpt > name')].map(n => n.textContent.trim()).filter(Boolean);
      gpxPoints = allPoints;

      // 時間：起訖、耗時、跨越天數
      const times = allPoints.map(p => p.time).filter(Boolean);
      const t0 = times[0] || null, t1 = times[times.length - 1] || null;
      let durationH = null, startDate = '', dayCount = 0;
      if (t0) {
        startDate = toDateInputValue(t0);
        if (t1) {
          durationH = (t1 - t0) / 3600000;
          const d0 = new Date(t0.getFullYear(), t0.getMonth(), t0.getDate());
          const d1 = new Date(t1.getFullYear(), t1.getMonth(), t1.getDate());
          dayCount = Math.round((d1 - d0) / 86400000) + 1;
        }
      }

      const trkNameEl = xml.querySelector('trk > name');
      gpxStats = {
        distKm: (dist / 1000).toFixed(2),
        gainM: Math.round(gain),
        lossM: Math.round(loss),
        maxAlt: isFinite(maxAlt) ? Math.round(maxAlt) : null,
        durationH, startDate, dayCount,
        trkName: trkNameEl ? trkNameEl.textContent.trim() : '',
        fileName: file.name,
      };

      // 摘要列
      document.getElementById('gpx-dist').textContent = gpxStats.distKm;
      document.getElementById('gpx-gain').textContent = gpxStats.gainM.toLocaleString();
      document.getElementById('gpx-loss').textContent = gpxStats.lossM.toLocaleString();
      document.getElementById('gpx-maxalt').textContent = gpxStats.maxAlt !== null ? gpxStats.maxAlt.toLocaleString() : '—';
      document.getElementById('gpx-dur').textContent = durationH !== null ? formatDuration(durationH) : '—';
      document.getElementById('gpxResult').classList.add('show');

      // 日期 / 天數（沒有時間戳的 GPX 就退回檔案修改日）
      derived.date = startDate || toDateInputValue(new Date(file.lastModified));
      derived.days = dayCount > 1 ? `${dayCount}天${dayCount - 1}夜` : '當日來回';

      // 偵測山頭 → 決定紀錄名稱與分類
      redetectPeaks();
    } catch(err) {
      alert('GPX 解析失敗：' + err.message);
    }
  };
  reader.readAsText(file);
}

// 依目前的判定範圍重新比對百岳座標
function redetectPeaks() {
  if (!gpxPoints.length) return;
  const th = Number(document.getElementById('peakThreshold').value);
  detectedPeaks = detectPeaksNearTrack(gpxPoints, th);

  // GPX 航點名稱裡有百岳山名的，也一併列入候選
  gpxWptNames.forEach(n => {
    PEAKS.forEach(p => {
      if (n.includes(p.name) && !detectedPeaks.some(d => d.name === p.name)) {
        detectedPeaks.push({ rank: p.rank, name: p.name, alt: p.alt, distM: null, time: null, viaWpt: true });
      }
    });
  });

  selectedPeaks = new Set(detectedPeaks.map(d => d.name));
  renderPeakChips();
  updateDerived();
}

function renderPeakChips() {
  const box = document.getElementById('peakDetect');
  const chips = document.getElementById('peakChips');
  box.classList.add('show');
  if (!detectedPeaks.length) {
    chips.innerHTML = `<span class="peak-detect-empty">這條軌跡沒有經過百岳（可放寬判定範圍再試）— 紀錄會用軌跡名稱命名</span>`;
    return;
  }
  chips.innerHTML = detectedPeaks.map(p => `
    <button type="button" class="peak-chip ${selectedPeaks.has(p.name) ? 'on' : ''}"
      onclick="togglePeak('${p.name}')"
      title="${p.viaWpt ? 'GPX 航點名稱' : '最近距離 ' + p.distM + ' m'}">
      ${p.name}<span class="alt">${p.alt.toLocaleString()}m</span>
    </button>`).join('');
}

function togglePeak(name) {
  if (selectedPeaks.has(name)) selectedPeaks.delete(name);
  else selectedPeaks.add(name);
  renderPeakChips();
  updateDerived();
}

// 由 GPX + 選中的山頭推導紀錄名稱與分類，並顯示出來讓人確認
function updateDerived() {
  if (!gpxStats) return;
  const names = detectedPeaks.filter(p => selectedPeaks.has(p.name)).map(p => p.name);

  // 名稱：選中的山頭 → 軌跡名稱 → 檔名
  derived.name = names.join('、')
    || gpxStats.trkName
    || gpxStats.fileName.replace(/\.gpx$/i, '');

  // 分類：有百岳就是百岳，否則按最高點粗分（慣例：郊山 <1000 m、中級山 1000 m 以上）
  derived.category = names.length ? '百岳'
    : (gpxStats.maxAlt >= 1000 ? '中級山' : '郊山');

  document.getElementById('derivedRow').innerHTML = `
    <span class="derived-item">紀錄名稱 <strong>${derived.name}</strong></span>
    <span class="derived-item">日期 <strong>${derived.date}</strong></span>
    <span class="derived-item">天數 <strong>${derived.days}</strong></span>
    <span class="derived-item">分類 <strong>${derived.category}</strong></span>`;
}

function toDateInputValue(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function formatDuration(hours) {
  const h = Math.floor(hours);
  const m = Math.round((hours - h) * 60);
  return h >= 24 ? `${Math.floor(h/24)}天${h%24}小時` : (h ? `${h}小時${m}分` : `${m}分`);
}

function haversine(lat1, lon1, lat2, lon2) {
  return haversineM(lat1, lon1, lat2, lon2); // 共用 peaks-data.js 的實作
}

// ── Photo Preview ──────────────────────────────────
// 上傳後先縮圖再轉 base64，否則幾張原圖就會撐爆 localStorage（約 5MB）
function previewPhotos(input) {
  const files = [...input.files].slice(0, 9);
  const row = document.getElementById('photoPreviewRow');
  row.innerHTML = files.length ? '<span style="font-size:.8rem;color:var(--gray-500)">處理中…</span>' : '';
  photoDataURLs = [];
  Promise.all(files.map(f => compressImage(f))).then(urls => {
    photoDataURLs = urls.filter(Boolean); // 保持原本選取順序
    row.innerHTML = photoDataURLs
      .map(u => `<img src="${u}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;" />`)
      .join('');
  });
}

function compressImage(file, maxDim = 1400, quality = 0.72) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => resolve(null);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

// ── Save Record ────────────────────────────────────
function saveRecord() {
  if (!gpxStats) { alert('請先上傳 GPX — 日期、山頭、距離、爬升都從裡面取得'); return; }

  const emojis = ['🏔','🌲','🌿','🌄','❄️','🗻','⛰️','🌅'];
  const record = {
    id: Date.now(),
    // 以下由 GPX 推導（見 updateDerived）
    name: derived.name,
    date: derived.date,
    category: derived.category,
    days: derived.days,
    distance: gpxStats.distKm,
    gain: gpxStats.gainM,
    peaks: [...selectedPeaks],
    loss: gpxStats.lossM,
    maxAlt: gpxStats.maxAlt,
    duration: gpxStats.durationH !== null ? formatDuration(gpxStats.durationH) : undefined,
    gpxFile: gpxStats.fileName,
    // 手動輸入的部分
    weight: document.getElementById('f-weight').value,
    note: document.getElementById('f-note').value.trim(),
    photos: photoDataURLs.slice(0, 9), // limit storage
    emoji: emojis[Math.floor(Math.random() * emojis.length)],
  };

  const backup = records;
  records = [record, ...records];
  try {
    localStorage.setItem('hikeRecords', JSON.stringify(records));
  } catch (err) {
    records = backup;
    alert('儲存失敗：瀏覽器儲存空間已滿（照片太多或太大）。請減少照片張數後再試。');
    return;
  }
  closeAddModal();
  renderAll();
}

// ── Delete Record ──────────────────────────────────
function deleteRecord(id, e) {
  e.preventDefault();
  e.stopPropagation();
  if (!confirm('確定刪除這筆紀錄？')) return;
  records = records.filter(r => r.id !== id);
  localStorage.setItem('hikeRecords', JSON.stringify(records));
  renderAll();
}

// ── Render ─────────────────────────────────────────
function switchTab(btn, cat) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTab = cat;
  renderCards();
}

function renderAll() {
  renderYearFilter();
  renderCards();
  document.getElementById('totalCount').textContent = `共 ${records.length} 筆紀錄`;
}

function renderYearFilter() {
  const years = [...new Set(records.map(r => r.date.slice(0,4)))].sort((a,b)=>b-a);
  const row = document.getElementById('yearFilter');
  row.innerHTML = `<button class="filter-pill active" onclick="setYear(this,'all')">全部時間</button>` +
    years.map(y => `<button class="filter-pill" onclick="setYear(this,'${y}')">${y}</button>`).join('');
}

let currentYear = 'all';
function setYear(btn, y) {
  document.querySelectorAll('#yearFilter .filter-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentYear = y;
  renderCards();
}

function renderCards() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let filtered = records.filter(r => {
    const catOk = currentTab === 'all' || r.category === currentTab;
    const yearOk = currentYear === 'all' || r.date.startsWith(currentYear);
    const textOk = !q || r.name.toLowerCase().includes(q)
      || (r.location||'').toLowerCase().includes(q)
      || (r.peaks||[]).some(p => p.toLowerCase().includes(q));
    return catOk && yearOk && textOk;
  });

  const grid = document.getElementById('cardGrid');
  document.getElementById('resultCount').textContent = `顯示 ${filtered.length} 筆`;

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="icon">🔍</div><p>${records.length ? '沒有符合條件的紀錄' : '還沒有紀錄，點右上角「新增紀錄」開始吧！'}</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(r => `
    <div class="record-card" style="cursor:default;">
      <div class="record-card-img">${
        r.photos && r.photos.length
          ? `<img src="${r.photos[0]}" style="width:100%;height:160px;object-fit:cover;" />`
          : r.emoji || '🏔'
      }</div>
      <button class="card-delete-btn" onclick="deleteRecord(${r.id}, event)" title="刪除">✕</button>
      <div class="record-card-body">
        <div class="record-card-title">${r.name}</div>
        <div class="record-card-meta">
          <span class="meta-chip">📅 ${r.date}</span>
          ${r.days ? `<span class="meta-chip">⏱ ${r.days}</span>` : ''}
          ${r.location ? `<span class="meta-chip">📍 ${r.location}</span>` : ''}
        </div>
        <div class="record-card-meta" style="margin-top:4px;">
          ${r.distance ? `<span class="meta-chip">📏 ${Number(r.distance).toFixed(1)} km</span>` : ''}
          ${r.gain ? `<span class="meta-chip">⬆️ ${Number(r.gain).toLocaleString()} m</span>` : ''}
          ${r.maxAlt ? `<span class="meta-chip">🗻 ${Number(r.maxAlt).toLocaleString()} m</span>` : ''}
          ${r.duration ? `<span class="meta-chip">⌛ ${r.duration}</span>` : ''}
          ${r.weight ? `<span class="meta-chip">🎒 ${r.weight} kg</span>` : ''}
        </div>
        ${r.peaks && r.peaks.length ? `
          <div class="card-peaks">
            ${r.peaks.map(p => `<span class="card-peak">🏔 ${p}</span>`).join('')}
          </div>` : ''}
        <div class="record-card-tags">
          ${r.category ? `<span class="tag">${r.category}</span>` : ''}
          ${r.photos && r.photos.length > 1 ? `<span class="gpx-badge">📷 ${r.photos.length}</span>` : ''}
          ${r.gpxFile ? `<span class="gpx-badge">GPX</span>` : ''}
        </div>
        ${r.photos && r.photos.length ? `
          <div class="card-photos">
            ${r.photos.slice(0,3).map(p => `<div class="card-photo-thumb"><img src="${p}" /></div>`).join('')}
            ${r.photos.length > 3 ? `<span class="card-photo-more">+${r.photos.length - 3}</span>` : ''}
          </div>` : ''}
        ${r.note ? `<p style="font-size:.8rem;color:var(--gray-500);margin-top:8px;line-height:1.5;">${r.note.slice(0,80)}${r.note.length>80?'…':''}</p>` : ''}
      </div>
    </div>
  `).join('');
}

// Init
renderAll();
</script>
</body>
</html>
