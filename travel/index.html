<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>旅遊 · Cworld</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d32020'/%3E%3Ctext x='32' y='46' font-family='Helvetica,Arial,sans-serif' font-size='46' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f7f7f5; --surface: #fff; --border: #e8e8e4;
      --text: #1a1a1a; --muted: #6b6b6b; --accent: #112840;
      --radius: 14px;
    }
    body { font-family: 'Helvetica Neue','PingFang TC','Microsoft JhengHei',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    nav { background: #112840; padding: 0 32px; display: flex; align-items: center; gap: 8px; height: 52px; }
    nav a { color: rgba(255,255,255,.65); text-decoration: none; font-size: .85rem; }
    nav a:hover { color: #fff; }
    nav .sep { color: rgba(255,255,255,.3); font-size: .85rem; }
    nav .current { color: #fff; font-weight: 600; font-size: .85rem; }

    .hero { background: linear-gradient(135deg, #112840, #1e5799); padding: 40px 48px 36px; color: #fff; }
    .hero h1 { font-size: 1.75rem; font-weight: 700; }
    .hero p { margin-top: 6px; font-size: .9rem; opacity: .7; }

    .container { max-width: 1100px; margin: 0 auto; padding: 28px 48px 80px; }

    /* 搜尋 */
    .search {
      width: 100%; font: inherit; font-size: .9rem; padding: 12px 16px;
      border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text);
    }
    .search:focus { outline: 2px solid rgba(30,87,153,.25); border-color: #9fb3cc; }

    /* 工具列：數量・排序・切換 */
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 18px 0 12px; font-size: .82rem; color: var(--muted); }
    .toolbar .count { margin-right: auto; }
    .tbtn {
      font: inherit; font-size: .8rem; font-weight: 700; cursor: pointer;
      background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px;
    }
    .tbtn:hover { border-color: #b9c3cf; }

    /* 篩選標籤 */
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .chip {
      font: inherit; font-size: .78rem; font-weight: 700; cursor: pointer;
      background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 99px; padding: 5px 12px;
    }
    .chip b { font-weight: 600; color: var(--muted); margin-left: 4px; }
    .chip.on { background: #3e5a78; color: #fff; border-color: #3e5a78; }
    .chip.on b { color: rgba(255,255,255,.75); }

    /* 卡片模式：同 Omniplay 遊戲卡（封面、標題＋日期膠囊、說明、兩顆按鈕） */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
    .card {
      position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 2px 10px rgba(0,0,0,.06); transition: box-shadow .25s ease, transform .25s ease;
    }
    .card:hover { box-shadow: 0 8px 28px rgba(0,0,0,.13); transform: translateY(-3px); }
    .ribbon { position: absolute; top: 0; right: 0; width: 92px; height: 92px; overflow: hidden; pointer-events: none; z-index: 2; }
    .ribbon span {
      position: absolute; top: 18px; right: -26px; width: 120px; transform: rotate(45deg);
      color: #fff; font-size: .68rem; font-weight: 800; letter-spacing: 1px; text-align: center; padding: 4px 0;
      box-shadow: 0 2px 6px rgba(0,0,0,.22);
    }
    .ribbon.planning span { background: linear-gradient(135deg, #f6a05a, #d97316); }
    .ribbon.done span { background: linear-gradient(135deg, #6cc08a, #3a8a50); }
    .cover {
      width: 100%; aspect-ratio: 330/250; border-radius: 12px; position: relative; overflow: hidden;
      background: linear-gradient(135deg, #3a2c1a, #6b4e2a);
    }
    .cover img { display: block; width: 100%; height: 100%; object-fit: cover; position: relative; z-index: 1; }
    .cover .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2.6rem; }
    .cbody { padding: 13px 6px 0; flex: 1; text-align: center; }
    .card-title { font-size: .96rem; font-weight: 800; letter-spacing: .4px; padding-bottom: 11px; border-bottom: 1px solid var(--border); }
    .card-title .pill {
      display: inline-block; vertical-align: middle; margin-left: 7px;
      font-size: .66rem; font-weight: 700; letter-spacing: 0; color: var(--muted);
      background: var(--bg); border: 1px solid var(--border); border-radius: 99px; padding: 2px 8px; font-variant-numeric: tabular-nums;
    }
    .card-route { padding: 11px 4px 13px; font-size: .78rem; color: var(--muted); line-height: 1.5; min-height: 56px; display: flex; align-items: center; justify-content: center; }
    .cfoot { display: flex; gap: 9px; padding: 0 6px; margin-top: auto; }
    .btn {
      flex: 1; border: 0; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px;
      padding: 10px 8px; border-radius: 8px; white-space: nowrap; text-decoration: none; font-size: .8rem; font-weight: 700;
      transition: background .15s;
    }
    .btn .ico { padding-left: 9px; border-left: 1px solid rgba(255,255,255,.25); line-height: 1; }
    .btn-plan { background: #1a1a1a; color: #fff; }
    .btn-plan:hover { background: #333; }
    .btn-map { background: #d32020; color: #fff; }
    .btn-map:hover { background: #ef3a3a; }
    .btn.disabled { background: var(--bg); border: 1px dashed var(--border); color: var(--muted); cursor: default; }
    .btn.disabled .ico { border-left-color: var(--border); }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 99px;
      font-size: .68rem; font-weight: 800; letter-spacing: .5px; color: #fff; white-space: nowrap;
    }
    .badge.planning { background: #d97316; }
    .badge.done { background: #3a8a50; }

    /* 清單模式：一列一趟，標籤／名稱固定寬，讓名稱與路線各自對齊 */
    .list { display: flex; flex-direction: column; gap: 8px; }
    .row {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
      text-decoration: none; color: inherit;
      transition: box-shadow .15s, transform .15s;
    }
    .row:hover { box-shadow: 0 6px 18px rgba(0,0,0,.10); transform: translateY(-1px); }
    .row .badge { flex: none; min-width: 60px; text-align: center; }
    .row .r-title { flex: 0 0 150px; font-size: .9rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .r-desc { min-width: 0; font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .r-meta { margin-left: auto; flex: none; font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }

    .empty { padding: 28px; text-align: center; color: var(--muted); font-size: .85rem; background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }

    @media (max-width: 640px) {
      .hero { padding: 28px 24px; }
      .container { padding: 20px 16px 60px; }
      .grid { grid-template-columns: 1fr; gap: 14px; }
      .row { flex-wrap: wrap; gap: 6px 10px; }
      .row .r-title { flex: 1 1 auto; }
      .row .r-desc { flex: 1 1 100%; white-space: normal; }
      .row .r-meta { margin-left: 0; }
    }
  </style>
</head>
<body>

<nav>
  <a href="../index.html">Cworld</a>
  <span class="sep">/</span>
  <span class="current">旅遊</span>
</nav>

<div class="hero">
  <h1>✈️ 旅遊</h1>
  <p>一次旅行一張卡，點卡片看完整計畫</p>
</div>

<div class="container">
  <input class="search" id="q" type="search" placeholder="搜尋旅行名稱、路線、日期…" autocomplete="off">

  <div class="toolbar">
    <span class="count" id="count"></span>
    <span>排序</span>
    <button class="tbtn" id="sortkey" type="button"></button>
    <button class="tbtn" id="sortdir" type="button" title="切換升／降冪"></button>
    <button class="tbtn" id="view" type="button"></button>
  </div>

  <div class="chips" id="chips"></div>
  <div id="body"></div>
</div>

<script>
// 新增旅行：在這裡加一筆，name 隨你取名；start 用 YYYY-MM-DD 給排序用；
// 再到 travel/ 底下開對應資料夾放該次旅行的 index.html
const TRIPS = [
  {
    name: '槍劍縱走',
    icon: '🗻',                 // 沒有 cover 圖時顯示的 icon
    cover: '',                  // 封面圖路徑（選填，例 'japan-alps-2026/cover.jpg'）
    map: 'japan-alps-2026/map.html',
    start: '2026-09-11',
    dates: '2026/9/11 – 9/20',
    route: '穗高岳山莊 → 槍岳山莊 → 三俁山莊 → 太郎平小屋 → 五色原山莊 → 劍山莊 → 室堂',
    href: 'japan-alps-2026/',
    status: 'done'       // planning=計畫中, done=已結束
  },
  {
    name: '大阪馬拉松',
    icon: '🏃',
    cover: '',
    map: 'osaka-marathon-2027/map.html',
    start: '2027-02-26',
    dates: '2027/2/26 – 3/1',
    route: 'TPE ✈ KIX → EXPO 領物 → 賽前勘查 → 2/28 大阪馬拉松 42.195 km → KIX ✈ TPE',
    href: 'osaka-marathon-2027/',
    status: 'planning'
  }
];

const STATUS_LABEL = { planning: '計畫中', done: '已結束' };
const SORTS = [{ key: 'date', label: '日期' }, { key: 'name', label: '名稱' }];

/* 檢視、排序、篩選記在這台裝置 */
const PK = 'travel.';
const pref = (k, d) => localStorage.getItem(PK + k) ?? d;
let view = pref('view', 'card');         // card | list
let sortKey = pref('sort', 'date');
let sortDesc = pref('dir', 'desc') === 'desc';
let filter = pref('filter', 'all');      // all | planning | done
let q = '';

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const hay = t => (t.name + ' ' + t.dates + ' ' + t.route + ' ' + STATUS_LABEL[t.status]).toLowerCase();

function render() {
  // 工具列文字
  document.getElementById('sortkey').textContent = '⇅ ' + SORTS.find(s => s.key === sortKey).label;
  document.getElementById('sortdir').textContent = sortDesc ? '↓' : '↑';
  document.getElementById('view').textContent = view === 'card' ? '☰ 清單' : '▦ 卡片';

  // 篩選標籤
  const n = k => k === 'all' ? TRIPS.length : TRIPS.filter(t => t.status === k).length;
  document.getElementById('chips').innerHTML = [['all', '全部'], ['planning', '計畫中'], ['done', '已結束']]
    .map(([k, l]) => `<button class="chip${filter === k ? ' on' : ''}" data-f="${k}" type="button">${l}<b>${n(k)}</b></button>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    filter = c.dataset.f; localStorage.setItem(PK + 'filter', filter); render();
  }));

  // 篩選＋搜尋＋排序
  let list = TRIPS.filter(t => (filter === 'all' || t.status === filter) && (!q || hay(t).includes(q)));
  list.sort((a, b) => {
    const r = sortKey === 'date' ? a.start.localeCompare(b.start) : a.name.localeCompare(b.name, 'zh-Hant');
    return sortDesc ? -r : r;
  });
  document.getElementById('count').textContent = `${list.length} 趟`;

  const body = document.getElementById('body');
  if (!list.length) { body.className = ''; body.innerHTML = '<div class="empty">沒有符合的旅行。</div>'; return; }
  if (view === 'card') {
    body.className = 'grid';
    body.innerHTML = list.map(t => `
      <div class="card">
        <div class="ribbon ${t.status}"><span>${STATUS_LABEL[t.status] || ''}</span></div>
        <div class="cover">${t.cover ? `<img src="${esc(t.cover)}" alt="" loading="lazy">` : `<span class="ph">${t.icon || '✈️'}</span>`}</div>
        <div class="cbody">
          <div class="card-title">${esc(t.name)}<span class="pill">${esc(t.dates)}</span></div>
          <div class="card-route">${esc(t.route)}</div>
        </div>
        <div class="cfoot">
          <a class="btn btn-plan" href="${esc(t.href)}">行程計畫 <span class="ico">›</span></a>
          ${t.map ? `<a class="btn btn-map" href="${esc(t.map)}">路線地圖 <span class="ico">🗺️</span></a>` : '<div class="btn disabled">無地圖</div>'}
        </div>
      </div>`).join('');
  } else {
    body.className = 'list';
    body.innerHTML = list.map(t => `
      <a class="row" href="${esc(t.href)}">
        <span class="badge ${t.status}">${STATUS_LABEL[t.status] || ''}</span>
        <span class="r-title">${t.icon || ''} ${esc(t.name)}</span>
        <span class="r-desc">${esc(t.route)}</span>
        <span class="r-meta">${esc(t.dates)}</span>
      </a>`).join('');
  }
}

document.getElementById('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
document.getElementById('sortkey').addEventListener('click', () => {
  const i = SORTS.findIndex(s => s.key === sortKey);
  sortKey = SORTS[(i + 1) % SORTS.length].key; localStorage.setItem(PK + 'sort', sortKey); render();
});
document.getElementById('sortdir').addEventListener('click', () => {
  sortDesc = !sortDesc; localStorage.setItem(PK + 'dir', sortDesc ? 'desc' : 'asc'); render();
});
document.getElementById('view').addEventListener('click', () => {
  view = view === 'card' ? 'list' : 'card'; localStorage.setItem(PK + 'view', view); render();
});
render();
</script>
</body>
</html>
