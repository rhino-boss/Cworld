<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>旅遊 · Cworld</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d32020'/%3E%3Ctext x='32' y='46' font-family='Helvetica,Arial,sans-serif' font-size='46' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f7f7f5; --surface: #fff; --border: #e8e8e4;
      --text: #1a1a1a; --muted: #6b6b6b;
      --radius: 14px;
    }
    body { font-family: 'Helvetica Neue','PingFang TC','Microsoft JhengHei',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    nav { background: #112840; padding: 0 32px; display: flex; align-items: center; gap: 8px; height: 52px; }
    nav a { color: rgba(255,255,255,.65); text-decoration: none; font-size: .85rem; }
    nav a:hover { color: #fff; }
    nav .sep { color: rgba(255,255,255,.3); font-size: .85rem; }
    nav .current { color: #fff; font-weight: 600; font-size: .85rem; }

    .hero { background: linear-gradient(135deg, #112840, #1e5799); padding: 40px 48px 36px; color: #fff; }
    .hero h1 { font-size: 1.75rem; font-weight: 700; }
    .hero p { margin-top: 6px; font-size: .9rem; opacity: .7; }

    .container { max-width: 1100px; margin: 0 auto; padding: 36px 48px 80px; }

    .status-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; font-size: .82rem; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a8a50; flex-shrink: 0; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }

    .card {
      position: relative; display: block;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      transition: box-shadow .2s, transform .2s;
      text-decoration: none; color: var(--text);
    }
    .card:hover { box-shadow: 0 8px 28px rgba(0,0,0,.13); transform: translateY(-3px); }

    .badge {
      position: absolute; top: 14px; right: 14px;
      padding: 3px 10px; border-radius: 99px;
      font-size: .68rem; font-weight: 800; letter-spacing: .5px; color: #fff;
    }
    .badge.planning { background: #d97316; }
    .badge.done { background: #3a8a50; }

    .card-title { font-size: 1.05rem; font-weight: 700; padding-right: 64px; }
    .card-date { margin-top: 6px; font-size: .8rem; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
    .card-route { margin-top: 4px; font-size: .82rem; color: var(--muted); line-height: 1.55; }

    @media (max-width: 640px) {
      .hero { padding: 28px 24px; }
      .container { padding: 24px 20px 60px; }
      .grid { grid-template-columns: 1fr; gap: 14px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="../index.html">Cworld</a>
  <span class="sep">/</span>
  <span class="current">旅遊</span>
</nav>

<div class="hero">
  <h1>✈️ 旅遊</h1>
  <p>一次旅行一張卡，點卡片看完整計畫</p>
</div>

<div class="container">
  <div class="status-bar">
    <div class="dot"></div>
    <span id="status-text"></span>
  </div>
  <div class="grid" id="trip-grid"></div>
</div>

<script>
// 新增旅行：在這裡加一筆，name 隨你取名；
// 再到 travel/ 底下開對應資料夾放該次旅行的 index.html
const TRIPS = [
  {
    name: '日本爬山🏔️',
    dates: '2026/9/11 – 9/20',
    route: '上高地 → 槍穗縱走 → 雲之平 → 立山 → 室堂',
    href: 'japan-alps-2026/',
    status: 'planning'   // planning=籌備中, done=已完成
  }
];

const STATUS_LABEL = { planning: '籌備中', done: '已完成' };

document.getElementById('trip-grid').innerHTML = TRIPS.map(t => `
  <a class="card" href="${t.href}">
    <div class="badge ${t.status}">${STATUS_LABEL[t.status] || ''}</div>
    <div class="card-title">${t.name}</div>
    <div class="card-date">${t.dates}</div>
    <div class="card-route">${t.route}</div>
  </a>
`).join('');

document.getElementById('status-text').textContent =
  `共 ${TRIPS.length} 個旅行計畫，${TRIPS.filter(t => t.status === 'planning').length} 個籌備中`;
</script>
</body>
</html>
