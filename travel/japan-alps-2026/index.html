.wrap{max-width:820px;margin:0 auto;padding:28px 16px 60px}

.daychips i{width:14px;height:4px;border-radius:2px;display:inline-block}
.legend{

}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.legend svg{flex:none}
.mapwrap{
  background:var(--paper); border:1px solid var(--line); border-radius:8px;
  overflow-x:auto; box-shadow:0 1px 0 rgba(0,0,0,.04);
}
.mapwrap svg{display:block;min-width:720px;width:100%;height:auto}
/* --- svg classes --- */
text{font-family:"Microsoft JhengHei","Noto Sans TC","Yu Gothic","Hiragino Sans",sans-serif}
.gridline{stroke:var(--grid);stroke-width:1}
.gridlabel{fill:var(--faint);font-size:9px}
.river{fill:none;stroke:var(--water);stroke-width:2.5;stroke-linecap:round;opacity:.75}
.riverlabel{fill:var(--waterlabel);font-size:10.5px;font-style:italic}
.route{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.spur{fill:none;stroke-width:2;stroke-dasharray:3 4;stroke-linecap:round}

.refpeak{fill:var(--ref)}
.hutshape{fill:var(--hut);stroke:var(--ink);stroke-width:1.3}
.stayshape{fill:var(--stayicon);stroke:var(--ink);stroke-width:1.2}
.passshape{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.placeshape{fill:var(--ink)}
.lbl{fill:var(--ink);font-size:11.5px}
.lbl.big{font-size:13px;font-weight:700}
.lbl.small{font-size:10px;fill:var(--muted)}
.lbl.ref{fill:var(--ref);font-size:10.5px}

.elev{fill:var(--muted);font-size:9.5px}
.staylbl{font-size:12px;font-weight:700;fill:var(--ink)}
.staydate{font-size:9.5px;fill:var(--stayicon);font-weight:700}
.staypill{fill:var(--staybg);stroke:var(--stayborder);stroke-width:1;rx:4}
.leader{stroke:var(--faint);stroke-width:.8}
.warnmark{fill:var(--warn);font-size:10px;font-weight:700}

.scaletext{fill:var(--muted);font-size:9.5px}
.north{fill:var(--ink)}

.day{

.day .tag{display:flex;flex-direction:column;gap:2px;padding-top:2px}
.day .dnum{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.day .dnum i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

  {maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'});
const gsi=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
  {maxZoom:18,attribution:'&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>'});
const topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
  {maxZoom:17,attribution:'&copy; OpenStreetMap contributors, SRTM | 樣式 &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'});
osm.addTo(map);

const dayLines=DAYROUTES.map((r,i)=>
  L.polyline(r.pts,{color:HNBLUE,weight:5,opacity:.9})
   .bindPopup(`<b>D${r.d}</b>（${r.date}）<br>${r.from} → ${r.to}`)
   .addTo(map));
L.polyline(SPUR,{color:HNBLUE,weight:3,opacity:.9,dashArray:'4 6'}).addTo(map);

document.getElementById('daymode').addEventListener('change',e=>{
  dayLines.forEach((pl,i)=>pl.setStyle({color:e.target.checked?DAYCOLORS[i]:HNBLUE}));
});

function icon(html){return L.divIcon({html,className:'lmkwrap',iconSize:null,iconAnchor:[7,8]});}
const gStay=L.layerGroup().addTo(map), gHut=L.layerGroup().addTo(map),
      gPeak=L.layerGroup().addTo(map), gPass=L.layerGroup().addTo(map),
      gRef=L.layerGroup().addTo(map);

STAYS.forEach(s=>L.marker([s[1],s[2]],{icon:icon(
  `<div class="lmk stay"><span class="dot"></span><span class="lbl mid">${s[3]} ${s[0]}</span></div>`),zIndexOffset:500})
  .bindPopup(`<b>${s[0]}</b>（${s[4]} m）<br>${s[3]} 過夜${s[5]?'<br>📌 '+s[5]:''}`).addTo(gStay));

HUTS.forEach(h=>L.marker([h[1],h[2]],{icon:icon(
  `<div class="lmk minor"><span class="dot"></span><span class="lbl">${h[0]}</span></div>`)})
  .bindPopup(`<b>${h[0]}</b>（${h[3]} m）<br>途經山屋`).addTo(gHut));

PEAKS.forEach(p=>L.marker([p[1],p[2]],{icon:icon(
  `<div class="lmk ${p[4]?'major':'minor'}"><span class="tri">▲</span><span class="lbl${p[4]?' mid':''}">${p[0]} ${p[3]}</span></div>`)})
  .bindPopup(`<b>${p[0]}</b> ${p[3]} m`).addTo(gPeak));

REFPEAKS.forEach(p=>L.marker([p[1],p[2]],{icon:icon(
  `<div class="lmk minor ref"><span class="tri">▲</span><span class="lbl">${p[0]} ${p[2+1]}</span></div>`)})
  .bindPopup(`<b>${p[0]}</b> ${p[3]} m（不經過，方位參考）`).addTo(gRef));

PASSES.forEach(p=>L.marker([p[1],p[2]],{icon:icon(
  `<div class="lmk minor pass"><span class="dot"></span><span class="lbl">${p[0]}</span></div>`)})
  .addTo(gPass));

const pin=c=>`<svg width="26" height="36" viewBox="0 0 26 36"><path d="M13 1C6.4 1 1 6.4 1 13c0 8.8 12 22 12 22s12-13.2 12-22C25 6.4 19.6 1 13 1z" fill="${c}" stroke="#fff" stroke-width="2"/><circle cx="13" cy="13" r="5" fill="#fff"/></svg>`;
L.marker([36.249,137.636],{icon:L.divIcon({html:pin('#2f9e44'),className:'lmkwrap',iconSize:[26,36],iconAnchor:[13,35]}),zIndexOffset:1000})
 .bindPopup('<b>上高地</b>（1505 m）<br>D1 起點').addTo(map);
L.marker([36.577,137.5955],{icon:L.divIcon({html:pin('#d33030'),className:'lmkwrap',iconSize:[26,36],iconAnchor:[13,35]}),zIndexOffset:1000})
 .bindPopup('<b>室堂</b>（2450 m）<br>D7 終點，阿爾卑斯路線下山 → 富山市').addTo(map);

L.control.layers(
  {'OpenStreetMap 街道圖':osm,'日本地理院地形圖':gsi,'OpenTopoMap 等高線圖':topo},
  {'過夜山屋':gStay,'途經山屋':gHut,'山頭':gPeak,'地標':gPass,'參考山頭':gRef},
  {position:'topleft'}).addTo(map);

function syncZoom(){const el=map.getContainer(),z=map.getZoom();el.classList.toggle('lz',z<12);el.classList.toggle('lzm',z<11);}
map.on('zoomend',syncZoom);

map.fitBounds(L.latLngBounds(DAYROUTES.flatMap(r=>r.pts)),{padding:[30,30]});
syncZoom();

// GPX 下載（示意路線）
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
document.getElementById('gpxbtn').addEventListener('click',()=>{
  const w=[];
  const wpt=(la,lo,name,ele,sym)=>w.push(`<wpt lat="${la}" lon="${lo}">`+(ele?`<ele>${ele}</ele>`:'')+`<name>${esc(name)}</name>`+(sym?`<sym>${sym}</sym>`:'')+`</wpt>`);
  wpt(36.249,137.636,'上高地（起點）',1505);
  STAYS.forEach(s=>wpt(s[1],s[2],`${s[3]}宿 ${s[0]}`,s[4],'Lodge'));
  HUTS.forEach(h=>wpt(h[1],h[2],h[0],h[3],'Lodge'));
  PEAKS.forEach(p=>wpt(p[1],p[2],p[0],p[3],'Summit'));
  wpt(36.577,137.5955,'室堂（終點）',2450);
  const segs=DAYROUTES.map(r=>`<trkseg>`+r.pts.map(p=>`<trkpt lat="${p[0]}" lon="${p[1]}"/>`).join('')+`</trkseg>`).join('');
  const gpx=`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Cworld travel" xmlns="http://www.topografix.com/GPX/1/1"><metadata><name>北阿爾卑斯大縱走 2026（示意）</name></metadata>${w.join('')}<trk><name>北阿爾卑斯大縱走 2026</name>${segs}</trk></gpx>`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([gpx],{type:'application/gpx+xml'}));
  a.download='北阿爾卑斯大縱走2026_示意.gpx';
  a.click();
  URL.revokeObjectURL(a.href);
});
})();
</script>

</body>
</html>
