<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>路線地圖 · 北阿爾卑斯大縱走 2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d32020'/%3E%3Ctext x='32' y='46' font-family='Helvetica,Arial,sans-serif' font-size='46' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f7f5; --paper:#fff; --ink:#1a1a1a; --muted:#6b6b6b; --faint:#9a9a94;
  --line:#e8e8e4; --bar:#112840;
}
html,body{height:100%}
body{
  font-family:'Helvetica Neue','PingFang TC','Microsoft JhengHei',sans-serif;
  color:var(--ink);background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;
}

/* 頂部列 */
.topbar{
  flex:none;height:52px;background:var(--bar);color:#fff;
  display:flex;align-items:center;gap:12px;padding:0 14px;
}
.back{
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  background:rgba(255,255,255,.14);color:#fff;border-radius:8px;
  padding:7px 13px;font-size:.85rem;font-weight:700;
}
.back:hover{background:rgba(255,255,255,.28)}
.topbar h1{font-size:.95rem;font-weight:700}
.topbar .spacer{margin-left:auto}
.gpx{
  display:inline-flex;align-items:center;gap:6px;background:#2f9e44;color:#fff;
  border:none;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;
}
.gpx:hover{background:#268a3a}
.modetoggle{font-size:13px;color:rgba(255,255,255,.8);display:inline-flex;gap:6px;align-items:center;cursor:pointer}

/* 地圖佔滿剩餘空間，高度圖固定在下方 */
#lmap{flex:1;min-height:0;background:#e8ede4;font-family:inherit;z-index:0}
.ichart{
  flex:none;border-top:1px solid var(--line);background:var(--paper);
  padding:6px 10px 4px;
}
.ichart svg{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.mapnote{
  flex:none;background:var(--paper);border-top:1px solid var(--line);
  padding:6px 14px 8px;font-size:12px;color:var(--faint);
}

/* 地圖標記樣式（與行程頁一致） */
.lmkwrap{background:none;border:none}
.lmk{display:flex;align-items:center;gap:3px;white-space:nowrap}
.lmk .lbl{font:600 11px/1.15 'Microsoft JhengHei','PingFang TC',sans-serif;color:#3b3b35;text-shadow:0 0 3px #fff,0 0 3px #fff,0 1px 2px #fff}
.lmk .tri{color:#4a4238;font-size:12px;line-height:1;text-shadow:0 0 2px #fff}
.lmk.major .lbl{font-size:12px;font-weight:800;color:#26261f}
.lmk.ref .tri{color:#9a9a90}
.lmk.ref .lbl{color:#8a8a80;font-weight:500}
.lmk .dot{width:11px;height:11px;border-radius:3px;background:#fff;border:2px solid #4a4a44;box-shadow:0 0 3px rgba(0,0,0,.35);flex:none}
.lmk.stay .dot{background:#e2801f;border-color:#fff;width:13px;height:13px}
.lmk.stay .lbl{font-weight:800;color:#8a4a00;font-size:12px}
.lmk.pass .dot{width:8px;height:8px;border-radius:50%;background:#5a5a52;border:2px solid #fff}
.tlbl{background:rgba(255,255,255,.92);border:1.5px solid #2f9e44;color:#1d7a33;font:700 10px/1.3 'Helvetica Neue','PingFang TC','Microsoft JhengHei',sans-serif;padding:1px 6px;border-radius:9px;white-space:nowrap}
.lz .minor{display:none}
.lzm .mid{display:none}
.leaflet-popup-content{font-family:'Microsoft JhengHei','PingFang TC',sans-serif;font-size:13px;line-height:1.6}
.hiker{font-size:24px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}

@media (max-width:640px){
  .topbar{height:48px;padding:0 10px;gap:8px}
  .topbar h1{font-size:.85rem}
  .gpx{padding:7px 10px;font-size:12px}
  .modetoggle{font-size:12px}
}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="./">← 返回行程</a>
  <h1>路線地圖</h1>
  <span class="spacer"></span>
  <label class="modetoggle"><input type="checkbox" id="daymode"> 依日期分色</label>
  <button class="gpx" id="gpxbtn">⬇ 下載GPX</button>
</div>

<div id="lmap"></div>

<div class="ichart"><svg id="ichart" viewBox="0 0 960 200"></svg></div>
<div class="mapnote">軌跡取自 OpenStreetMap 步道資料，行前請再與官方圖資核對</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="route-map.js"></script>
<script>
// 版面是 flex 撐開的，地圖要在尺寸確定後重新量一次
window.addEventListener('load', () => window._tripMap && window._tripMap.invalidateSize());
window.addEventListener('resize', () => window._tripMap && window._tripMap.invalidateSize());
</script>
</body>
</html>
