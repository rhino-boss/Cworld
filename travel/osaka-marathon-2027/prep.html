<style>
.prog{--inner:#bfdbef;background:#fff;border:1.5px solid var(--inner);border-radius:18px;padding:14px 18px;margin:0 0 16px;box-shadow:0 2px 10px rgba(90,58,26,.06);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prog .pt{font-weight:700;color:var(--brown);font-size:15px}
.prog .pt small{font-weight:700;color:var(--muted);font-size:12px;margin-left:6px}
.prog .bar{flex:1;min-width:160px;height:12px;border-radius:999px;background:var(--c-sky);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),#ff9fbf);border-radius:999px;transition:width .3s}
.prog .pct{font-weight:700;color:var(--pink);min-width:44px;text-align:right}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcat{background:#fff;border:1.5px solid var(--inner);border-radius:18px;padding:12px 14px 10px;box-shadow:0 2px 10px rgba(90,58,26,.06)}
.pcat h3{margin:0 0 8px;font-size:15px;color:var(--brown);display:flex;align-items:center;gap:8px}
.pcat h3 .ic{width:30px;height:30px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.pcat.c-must h3 .ic{background:var(--c-pink)}.pcat.c-cloth h3 .ic{background:var(--c-sky)}.pcat.c-run h3 .ic{background:var(--c-mint)}.pcat.c-other h3 .ic{background:var(--c-yel)}
.pcat h3 .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.pcat h3 .cnt.ok{color:#2f7a4c}
.ck{list-style:none;margin:0;padding:0;font-size:13.5px}
.ck li{margin:0;display:flex;gap:9px;align-items:center;padding:7px 6px;line-height:1.5;border-bottom:1px solid #f3eee4}
.pcat .ck li:last-child{border-bottom:none}
.ck li:hover{background:var(--c-sky)}
.pcat.c-must .ck li:hover{background:var(--c-pink)}.pcat.c-run .ck li:hover{background:var(--c-mint)}.pcat.c-other .ck li:hover{background:var(--c-yel)}
.ck input[type=checkbox]{flex:none;accent-color:var(--pink);width:17px;height:17px;margin:0;cursor:pointer}
.ck label{flex:1;cursor:pointer;color:var(--brown)}
.ck .done{color:var(--muted);text-decoration:line-through}
.ck .note{color:var(--muted);font-style:normal;font-size:12px;margin-left:4px}
.todo .ck{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.todo .ck li{padding:8px 6px}
.todo .ck li:last-child{border-bottom:1px solid #f3eee4}
.todo .ck li:hover{background:transparent}
.tipbox{margin-top:12px;background:#fff;border:1.5px solid var(--inner);border-radius:14px;padding:10px 14px;font-size:12.5px;color:var(--muted);line-height:1.7}
.tipbox b{color:var(--pink)}
@media (max-width:640px){.pgrid{grid-template-columns:1fr}.todo .ck{grid-template-columns:1fr}}
</style>
</head>

<div class="wrap">
  <div class="hicon">🎒</div>
  <h1>準備</h1>
  <p class="sub">出發前把清單一項項勾掉；比賽裝備（跑鞋、襪子、衣褲）都用練跑穿慣的，不要帶新品直接上場。</p>

  <div class="prog"><div class="pt">打包進度<small id="pcount"></small></div><div class="bar"><i id="pbar"></i></div><div class="pct" id="ppct">0%</div></div>

  <div class="sec pink">
    <h2>攜帶物品</h2>
    <div class="pgrid" id="packlist"></div>
    <div class="tipbox"><b>提醒</b>：號碼布、安全手環 D1 在 INTEX 領到後就放進比賽袋；比賽日不寄物，起跑前保暖層要可以丟；補給膠賽前一晚先別在短褲上。</div>
  </div>

  <div class="sec sky todo">
    <h2>待確認</h2>
    <div class="pcat c-cloth"><ul class="ck" id="todolist"></ul></div>
  </div>
</div>
<script>
(function(){ const dd=document.querySelector('#tabbar .dd'); if(!dd) return; const t=dd.querySelector('.ddt');
  t.addEventListener('click',e=>{ e.preventDefault(); dd.classList.toggle('open'); });
  document.addEventListener('click',e=>{ if(!dd.contains(e.target)) dd.classList.remove('open'); });
})();
</script>
<script>
(function(){
const PREFIX='osaka27.';
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const load=K=>{ try{ const v=JSON.parse(localStorage.getItem(K)); return Array.isArray(v)?v:[]; }catch(e){ return []; } };
const save=(K,v)=>{ try{ localStorage.setItem(K,JSON.stringify(v)); }catch(e){} };
const idOf=(pre,t)=>pre+t.replace(/[^\w\u4e00-\u9fff]/g,'_');

/* ── 攜帶物品：分類固定在程式裡，瀏覽器只記勾選 ── */
const CATS=[
  {c:'must',  name:'必帶',  ic:'🛂', items:['護照','日幣','信用卡','參賽確認信']},
  {c:'cloth', name:'服裝',  ic:'🧥', items:['羽絨（阿羲）','風雨衣（皮卡丘）','保暖：手套、毛帽','鴨舌帽','衣：立山、劍岳','褲：on、迪卡農繭型褲','襪：M、D','Y拖']},
  {c:'run',   name:'比賽',  ic:'🏃', items:['補給：能量膠 ×4、鹽錠','跑鞋','號碼布、安全手環（D1 領）','可丟的起跑保暖層']},
  {c:'other', name:'其他',  ic:'🔌', items:['行動電源','轉接頭','盥洗：刮鬍刀、牙刷、牙膏']},
];
const PK=PREFIX+'pack4.done';
let done=new Set(load(PK));
const box=document.getElementById('packlist');
function renderPack(){
  box.innerHTML=CATS.map(g=>{
    const n=g.items.filter(t=>done.has(t)).length;
    return `<div class="pcat c-${g.c}"><h3><span class="ic">${g.ic}</span>${g.name}<span class="cnt${n===g.items.length?' ok':''}">${n} / ${g.items.length}</span></h3><ul class="ck">`+
      g.items.map(t=>{ const id=idOf('p_',t); return `<li><input type="checkbox" id="${id}" data-t="${esc(t)}" ${done.has(t)?'checked':''}><label for="${id}" class="${done.has(t)?'done':''}">${esc(t)}</label></li>`; }).join('')+'</ul></div>';
  }).join('');
  const all=CATS.reduce((a,g)=>a+g.items.length,0), k=CATS.reduce((a,g)=>a+g.items.filter(t=>done.has(t)).length,0);
  const pct=all?Math.round(k/all*100):0;
  document.getElementById('pcount').textContent=`${k} / ${all}`;
  document.getElementById('pbar').style.width=pct+'%';
  document.getElementById('ppct').textContent=pct+'%';
  box.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',()=>{ cb.checked?done.add(cb.dataset.t):done.delete(cb.dataset.t); save(PK,[...done]); renderPack(); }));
}
renderPack();

/* ── 待確認 ── */
const TODO=[
  {t:'買 eSIM'},
  {t:'換日幣'},
  {t:'海遊館門票線上預購', n:'¥2,700'},
  {t:'太陽之塔內部參觀預約', n:'¥720'},
  {t:'查 千里中央 → 勝尾寺 阪急巴士時刻'},
  {t:'心齋橋燒肉訂位', n:'D3 18:00'},
  {t:'出發前看 Booking 訊息的入住指示'},
];
const TK=PREFIX+'todo4.done';
let tdone=new Set(load(TK));
const tl=document.getElementById('todolist');
function renderTodo(){
  tl.innerHTML=TODO.map(it=>{ const id=idOf('t_',it.t); const d=tdone.has(it.t);
    return `<li><input type="checkbox" id="${id}" data-t="${esc(it.t)}" ${d?'checked':''}><label for="${id}" class="${d?'done':''}">${esc(it.t)}${it.n?`<em class="note">${esc(it.n)}</em>`:''}</label></li>`; }).join('');
  tl.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',()=>{ cb.checked?tdone.add(cb.dataset.t):tdone.delete(cb.dataset.t); save(TK,[...tdone]); renderTodo(); }));
}
renderTodo();
})();
</script>
</body>
