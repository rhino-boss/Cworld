html{scroll-behavior:smooth}

/* 地圖總覽 */
.ov{margin:0 0 16px;padding:10px 10px 8px}
.ov .bar{display:flex;align-items:center;gap:8px;margin:0 4px 8px}
.ov .bar b{color:var(--brown);font-size:1.05rem;margin-right:auto}
.ov .tg{display:inline-flex;border:2px solid var(--b-sky);border-radius:999px;overflow:hidden;background:#fff}
.ov .tg button{border:0;background:#fff;font:inherit;font-weight:700;font-size:12.5px;padding:5px 12px;cursor:pointer;color:var(--blue)}
.ov .tg button.on{background:var(--blue);color:#fff}
#ovmap{height:360px;border-radius:14px;border:2px solid #fff;background:#e8ede4;z-index:0;box-shadow:0 2px 10px rgba(90,58,26,.12)}
.ov .days{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding:3px 3px 6px;scrollbar-width:none}
.ov .days::-webkit-scrollbar{display:none}
.ov .dc{flex:none;width:200px;height:84px;display:flex;flex-direction:column;justify-content:center;background:#fff;border:2px solid #fff;border-radius:14px;padding:8px 12px;cursor:pointer;box-shadow:0 2px 8px rgba(90,58,26,.08);transition:box-shadow .15s,border-color .15s}
.ov .dc:hover{box-shadow:0 0 0 2px var(--b-sky),0 2px 8px rgba(90,58,26,.08)}
.ov .dc.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset,0 2px 8px rgba(90,58,26,.08)}
.ov .dc .h{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.ov .dc .h i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ov .dc .h small{color:var(--muted);font-weight:700;font-size:11px}
.ov .dc .pl{font-size:12px;color:var(--ink);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov .dc .km{font-size:11px;color:var(--muted);margin-top:2px}
.ov .dc .km b{color:var(--blue);font-size:13px}
.ovmk{background:none;border:none}
.ovmk .n{width:22px;height:22px;border-radius:50%;color:#fff;font:700 11px/22px 'Microsoft JhengHei',sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.ovmk .lb{position:absolute;left:26px;top:2px;white-space:nowrap;font:700 11px/1.2 'Microsoft JhengHei','PingFang TC',sans-serif;color:#26261f;text-shadow:0 0 3px #fff,0 0 3px #fff,0 1px 2px #fff}
@media (max-width:640px){#ovmap{height:300px}}
.day{padding:14px 16px;margin:0 0 12px;scroll-margin-top:64px}
.day:last-child{margin-bottom:0}
.dhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.dnum{width:44px;height:44px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.ddate{background:var(--c-sky);color:var(--blue);font-weight:700;border-radius:999px;padding:1px 10px;font-size:12px}
.route{font-size:15px;font-weight:700;margin:2px 0 4px}
.meta{font-size:12.5px;color:var(--muted);margin-bottom:10px;line-height:1.7}
.meta b{color:var(--pink);font-weight:700;margin-right:2px}
.chain .cnode{display:flex;align-items:baseline;gap:8px;padding:6px 10px;border-radius:14px;background:#fff;border:2px solid var(--c-sky);font-weight:700}
.chain .ctime{font-size:12.5px;font-weight:700;background:var(--c-sky);color:var(--blue);border-radius:999px;padding:0 9px;white-space:nowrap}
.chain .ctime::before{content:'🕒';font-size:11px;margin-right:4px}
.chain .cname{font-size:13.5px;color:var(--brown)}
.chain .cicons{margin-left:auto;flex:none;display:inline-flex;gap:6px}
.chain .cphoto{margin:6px 0 2px 14px;border-radius:12px;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 10px rgba(90,58,26,.12)}
.chain .cleg{display:flex;gap:10px;padding:5px 0 5px 14px}
.chain .cbar{flex:none;width:3px;background:var(--b-sky);border-radius:3px;margin:-6px 0}
.chain .ctext{font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.6}
details.alt{margin-top:14px;border:2px dashed #aacfea;border-radius:14px;background:#f4fbff}
details.alt>summary{padding:10px 14px;font-weight:700;color:#2f7fc6;cursor:pointer;font-size:14px}
details.alt .altbody{padding:0 14px 12px}
</style>

<div class="wrap">
  <div class="hicon">🏃</div>
  <h1>完整行程</h1>
  <p class="sub">四天三夜一條線：D1 飛大阪領物逛海遊館、D2 太陽之塔＋勝尾寺、D3 跑 42.195 km、D4 和歌山城回家。點上面的日期卡只看那一天。</p>
  <div class="sec ov">
    <div class="bar"><b>🗺️ 路線總覽</b><span class="hint" style="font-size:12px;color:var(--muted)">點日期卡只看那天；路線沿道路拉（近似電車／巴士走向）</span></div>
    <div id="ovmap"></div>
    <div class="days" id="ovdays"></div>
  </div>
  <div class="sec pink" id="days"></div>
  <footer>行程資料與行程頁共用（days.js）；備註在行程頁改過的文字這裡會一起顯示。</footer>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="days.js?v=5"></script>
<script src="routes.js?v=2"></script>
<script>
(function(){
const EDITS=(()=>{ try{ return JSON.parse(localStorage.getItem('osaka27.edits'))||{}; }catch(e){ return {}; } })();
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function chainHTML(chain, dayKey){
  let li=0;
  return '<div class="chain">'+chain.map(item=>{
    if(Array.isArray(item)){
      const o=item[2]||{};
      const mv=item[1].split('→').map(x=>x.trim()).filter(Boolean);
      const mapUrl=o.m?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(o.m)
        :(mv.length===2?'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(mv[0]+' 大阪')+'&destination='+encodeURIComponent(mv[1]+' 大阪')+'&travelmode=transit':'');
      return '<div class="cnode"><span class="ctime">'+item[0]+'</span><span class="cname">'+item[1]+'</span><span class="cicons">'+
        (mapUrl?'<a class="lnk map" href="'+esc(mapUrl)+'" target="_blank" rel="noopener" title="Google Map">📍</a>':'')+
        (o.u?'<a class="lnk" href="'+esc(o.u)+'" target="_blank" rel="noopener" title="開啟官網">↗</a>':'')+'</span></div>'+
        (o.p&&o.p.length?'<div class="cphoto"><div class="track">'+o.p.map(src=>'<img src="'+esc(src)+'" alt="">').join('')+'</div>'+(o.p.length>1?'<button type="button" class="pv">‹</button><button type="button" class="nx">›</button><div class="dots"></div>':'')+'</div>':'');
    }
    const def=[item.n,item.t].filter(Boolean).join('・');
    const k='leg.'+dayKey+'.'+(li++);
    const txt=esc(EDITS[k]||def).split(/；/).map(x=>x.trim()).filter(Boolean).join('<br>');
    return '<div class="cleg"><span class="cbar"></span><span class="ctext">'+txt+'</span></div>';
  }).join('')+'</div>';
}
document.getElementById('days').innerHTML=DAYS.map(v=>
  '<section class="card day" id="'+v.d+'">'+
    '<div class="dhead"><div class="dnum" style="background:var(--d'+v.c+')">'+v.d+'</div><span class="ddate">'+v.date+'</span></div>'+
    '<div class="route">'+v.route+'</div>'+(v.meta?'<div class="meta">'+v.meta+'</div>':'')+
    chainHTML(v.chain,v.d)+
    (v.alt?'<details class="alt" open><summary>☃ '+v.alt.title+'</summary><div class="altbody"><div class="route">'+v.alt.route+'</div>'+(v.alt.note?'<div class="meta">'+v.alt.note+'</div>':'')+chainHTML(v.alt.chain,v.d+'alt')+'</div></details>':'')+
  '</section>').join('');
window.bindCarousels&&window.bindCarousels(document);
/* ── 地圖總覽：每天的地點依序連線，底部日期卡可切換 ── */
(function(){
  const el=document.getElementById('ovmap'); if(!el||!window.L) return;
  const km=(a,b)=>{const R=6371,dLa=(b[0]-a[0])*Math.PI/180,dLo=(b[1]-a[1])*Math.PI/180,x=Math.sin(dLa/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x));};
  const COL={1:'#e8457c',2:'#5aa86e',3:'#8a5fd8',4:'#2f7fc6'};
  // 每天的點：有 ll 的節點，名稱只留地點（去掉「晚餐：」「起點（…）」這類前綴）
  const place=n=>n.replace(/^(晚餐|午餐|早餐|慶功晚餐)：/,'').replace(/（[^）]*）/g,'').replace(/・.*$/,'').replace(/s*→.*$/,'').replace(/ Check-in$/,'').trim();
  const days=DAYS.map(v=>{const pts=[];v.chain.forEach(it=>{if(Array.isArray(it)&&it[2]&&it[2].ll){const nm=it[2].pl||place(it[1]);if(!pts.length||pts[pts.length-1].name!==nm)pts.push({name:nm,ll:it[2].ll});}});
    let dist=0;for(let i=1;i<pts.length;i++)dist+=km(pts[i-1].ll,pts[i].ll);return{d:v.d,date:v.date,c:v.c,pts,dist};});
  const map=L.map('ovmap',{scrollWheelZoom:true});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
  const layers=days.map(dy=>{const g=L.layerGroup();
    const R=window.ROUTES&&window.ROUTES[dy.d];
    const line=(R&&R.line&&R.line.length>1)?R.line:dy.pts.map(p=>p.ll);
    if(R&&R.km) dy.dist=R.km;
    if(line.length>1){ L.polyline(line,{color:'#fff',weight:7,opacity:.7}).addTo(g); L.polyline(line,{color:COL[dy.c],weight:4,opacity:.9}).addTo(g); }
    dy.pts.forEach((p,i)=>L.marker(p.ll,{icon:L.divIcon({className:'ovmk',iconSize:null,iconAnchor:[11,11],html:'<div class="n" style="background:'+COL[dy.c]+'">'+(i+1)+'</div><div class="lb">'+p.name+'</div>'})}).addTo(g));
    return g;});
  let mode='all',cur=0;
  function showDays(){ document.querySelectorAll('#days > section.day').forEach((s,i)=>{ s.style.display=(mode==='all'||i===cur)?'':'none'; }); }
  const bounds=pts=>L.latLngBounds(pts.map(p=>p.ll));
  function render(){
    layers.forEach((g,i)=>{ if(mode==='all'||i===cur) g.addTo(map); else map.removeLayer(g); });
    const pts=mode==='all'?days.flatMap(x=>x.pts):days[cur].pts;
    if(pts.length) map.fitBounds(bounds(pts),{padding:[28,28],maxZoom:mode==='all'?10:14}); else map.setView([34.69,135.50],11);
    document.querySelectorAll('.ov .dc').forEach(c=>{ const i=c.dataset.i; c.classList.toggle('on', i==='all'?mode==='all':(mode==='day'&&+i===cur)); });
    showDays();
  }
  const total=Math.round(days.reduce((a,x)=>a+x.dist,0));
  document.getElementById('ovdays').innerHTML='<div class="dc all on" data-i="all"><div class="h"><i style="background:#3b2a1a"></i>全部 <small>4 天</small></div><div class="pl">看全程、顯示每一天</div><div class="km"><b>'+total+'</b> km 移動</div></div>'+
    days.map((dy,i)=>'<div class="dc" data-i="'+i+'"><div class="h"><i style="background:'+COL[dy.c]+'"></i>'+dy.d+' <small>'+dy.date+'</small></div><div class="pl">'+dy.pts.map(p=>p.name).join('・')+'</div><div class="km"><b>'+Math.round(dy.dist)+'</b> km 移動</div></div>').join('');
  document.querySelectorAll('.ov .dc').forEach(c=>c.addEventListener('click',()=>{ if(c.dataset.i==='all'){mode='all';} else {cur=+c.dataset.i;mode='day';} render();
  }));
  render();
  window.addEventListener('load',()=>{map.invalidateSize();render();});
})();
if(location.hash){ const el=document.querySelector(location.hash); el&&el.scrollIntoView(); }
})();
</script>
<script>
(function(){ const dd=document.querySelector('#tabbar .dd'); if(!dd) return; const t=dd.querySelector('.ddt');
  t.addEventListener('click',e=>{ e.preventDefault(); dd.classList.toggle('open'); });
  document.addEventListener('click',e=>{ if(!dd.contains(e.target)) dd.classList.remove('open'); });
})();
</script>
</body>
