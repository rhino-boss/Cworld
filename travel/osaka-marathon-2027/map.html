<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>路線地圖 · 大阪馬拉松 2027</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d32020'/%3E%3Ctext x='32' y='46' font-family='Helvetica,Arial,sans-serif' font-size='46' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue','PingFang TC','Microsoft JhengHei',sans-serif;color:#1a1a1a;background:#f7f7f5;min-height:100vh}
.topbar{height:52px;background:linear-gradient(90deg,#2f7fc6,#5aa0dc);color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;position:sticky;top:0;z-index:5}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:7px 13px;font-size:.85rem;font-weight:700}
.back:hover{background:rgba(255,255,255,.32)}
.topbar h1{font-size:.95rem;font-weight:700}
.topbar .spacer{margin-left:auto}
.src{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#2f7fc6;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:800;text-decoration:none}
.src:hover{background:#ffe3ec;color:#e8457c}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.wrap img{display:block;width:100%;height:auto;border-radius:12px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.wrap img+img{margin-top:12px}
.note{font-size:12px;color:#9a9a94;margin-top:10px;text-align:center}
@media (max-width:640px){.topbar{height:48px;padding:0 10px;gap:8px}.topbar h1{font-size:.85rem}.src{padding:7px 10px;font-size:12px}.wrap{padding:10px}}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="./">← 返回行程</a>
  <h1>大阪馬拉松 2027・路線地圖</h1>
  <span class="spacer"></span>
  <a class="src" href="https://www.osaka-marathon.com/2027/info/course" target="_blank" rel="noopener">官方コース紹介 ↗</a>
</div>
<div class="wrap">
  <img src="course_map.jpg" alt="大阪マラソン2027 コース図">
  <img src="course_elev.jpg" alt="コース高低図">
  <p class="note">圖片來自大會官網「コース紹介」；大會未提供 GPX，各公里標與關門點以跑者手冊為準。</p>
</div>
</body>
</html>
