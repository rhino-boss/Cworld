<style>

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.item{display:flex;flex-direction:column}
.item .ph{position:relative;background:#fff;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.item .ph img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.item .ph .none{color:var(--faint);font-size:12px;text-align:center;padding:12px}
.item .qty{position:absolute;top:8px;left:8px;background:var(--pink);color:#fff;font-weight:700;font-size:12px;border-radius:999px;padding:2px 10px}
.item .body{padding:10px 12px 12px}
.item .name{font-weight:700;font-size:14.5px;color:var(--brown)}
.item .note{font-size:12.5px;color:var(--muted);margin-top:3px}
.item .where{font-size:12px;margin-top:6px;color:var(--blue);font-weight:700}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
</style>

<div class="wrap">
  <div class="hicon">🛍️</div>
  <h1>必買</h1>
  <p class="sub">藥妝在難波／心齋橋的松本清、大國藥妝都買得到；mont-bell 行程上會經過 EXPOCITY店（D2）、大丸心齋橋店、天王寺MIO店（D4）。</p>

  <div class="sec lav"><h2>藥妝・保養</h2><div class="grid" id="cosme"></div></div>
  <div class="sec mint"><h2>mont-bell</h2><div class="grid" id="montbell"></div></div>
  <div class="sec yel"><h2>補給</h2><div class="grid" id="supply"></div></div>


  <footer>照片為你給我的參考圖；想換圖就把新檔放進 <code>img/shop/</code>，檔名照卡片上的代號。</footer>
</div>
<script>
// 必買清單（照片放 img/shop/<key>.jpg；沒有照片的卡會顯示代號提示）
const ITEMS=[
  {g:'cosme', key:'bb',       name:'BB 霜',          qty:'×1',   note:'INTEGRATE Pro Quality BB（紅管）', where:'松本清／大國藥妝'},
  {g:'cosme', key:'powder',   name:'粉餅',           qty:'×1',   note:'IHADA 薬用フェイスプロテクトパウダー SPF40・PA++++', where:'松本清／大國藥妝'},
  {g:'cosme', key:'patch1',   name:'痘痘貼',         qty:'×4 組', note:"Today's Cosme CICA＋ Zero Spot Patch（綠色包裝）", where:'藥妝店'},
  {g:'cosme', key:'patch2',   name:'痘痘貼',         qty:'',     note:'KOSE CLEAR TURN ごめんね素肌 キニシナイ 46 枚（黃色包裝，也可以）', where:'藥妝店'},
  {g:'cosme', key:'muji',     name:'無印良品 溫和去角質洗面乳', qty:'×2', note:'マイルドスクラブ洗顔フォーム 200g', where:'無印良品（難波／梅田）'},
  {g:'montbell', key:'mb-tee',   name:'mont-bell T 恤',  qty:'×1', note:'帳篷營地圖案那件', where:'mont-bell EXPOCITY店（D2）／大丸心齋橋店／天王寺MIO店（D4）'},
  {g:'montbell', key:'mb-chop',  name:'mont-bell 筷子',  qty:'',   note:'野外筷（野箸）', where:'mont-bell EXPOCITY店（D2）／大丸心齋橋店／天王寺MIO店（D4）'},
  {g:'supply', key:'amino', name:'aminoVITAL 全馬組合包', qty:'×8 盒', note:'Perfect Energy 5000／2500・GOLD・PRO 組合，買就送 aminoShot ×2；效期 GOLD 2027.01.09、PRO／PE 2026.12.18', where:'MW 商城（IG mwshoptw）— 台灣訂'},
  {g:'montbell', key:'mb-ltd',   name:'mont-bell 限定 T', qty:'',  note:'大阪／關西限定款，到店再看', where:'mont-bell EXPOCITY店（D2）／大丸心齋橋店／天王寺MIO店（D4）'},
];
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
for(const g of ['cosme','montbell','supply']){
  document.getElementById(g).innerHTML=ITEMS.filter(i=>i.g===g).map(i=>
    '<div class="card item '+g+'"><div class="ph">'+
      '<img src="img/shop/'+i.key+'.jpg?v=2" alt="" onerror="this.remove()">'+
      '<div class="none">尚無照片<br><small>img/shop/'+i.key+'.jpg?v=2</small></div>'+
      (i.qty?'<span class="qty">'+esc(i.qty)+'</span>':'')+
    '</div><div class="body"><div class="name">'+esc(i.name)+'</div>'+
      (i.note?'<div class="note">'+esc(i.note)+'</div>':'')+
      (i.where?'<div class="where">📍 '+esc(i.where)+'</div>':'')+
    '</div></div>').join('');
}
// 圖載成功就把「尚無照片」蓋掉
document.querySelectorAll('.item .ph img').forEach(img=>{ img.addEventListener('load',()=>{ const n=img.parentNode.querySelector('.none'); n&&n.remove(); }); if(img.complete&&img.naturalWidth>0){ const n=img.parentNode.querySelector('.none'); n&&n.remove(); } });
</script>
<script>
(function(){ const dd=document.querySelector('#tabbar .dd'); if(!dd) return; const t=dd.querySelector('.ddt');
  t.addEventListener('click',e=>{ e.preventDefault(); dd.classList.toggle('open'); });
  document.addEventListener('click',e=>{ if(!dd.contains(e.target)) dd.classList.remove('open'); });
})();
</script>
