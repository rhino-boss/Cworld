<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>吃什麼 · 大阪馬拉松 2027</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d32020'/%3E%3Ctext x='32' y='46' font-family='Helvetica,Arial,sans-serif' font-size='46' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
<style>
:root{--sky:#dff1fb;--sky2:#f4fbff;--brown:#5a3a1a;--pink:#e8457c;--blue:#2f7fc6;--c-sky:#e4f1fb;--b-sky:#aacfea;--c-lav:#ece4f8;--b-lav:#c9b6e8;
  --ink:#3b2a1a;--muted:#7a6a5a;--faint:#a39484;--line:#e3ecf3;--d1:#e8457c;--d2:#5aa86e;--d3:#8a5fd8;--d4:#2f7fc6}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif;line-height:1.6;
  background:linear-gradient(180deg,#cfe9fa 0,var(--sky) 30%,var(--sky2) 100%);background-attachment:fixed}
b{font-weight:700}
.cnav{background:linear-gradient(90deg,#2f7fc6,#5aa0dc);padding:0 24px;display:flex;align-items:center;gap:8px;height:52px;position:sticky;top:0;z-index:5}
.cnav a{color:rgba(255,255,255,.75);text-decoration:none;font-size:.85rem}
.cnav a:hover{color:#fff}
.cnav .sep{color:rgba(255,255,255,.4);font-size:.85rem}
.cnav .current{color:#fff;font-weight:700;font-size:.85rem}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px}
h1{color:var(--brown);font-size:1.6rem;font-weight:700;margin:6px 0 2px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.spot{background:#fff;border:3px solid var(--b-lav);border-radius:20px;overflow:hidden;margin:0 0 16px;box-shadow:0 6px 0 rgba(90,58,26,.05),0 8px 20px rgba(47,127,198,.10)}
.cphoto{position:relative;background:#000}
.cphoto .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cphoto .track::-webkit-scrollbar{display:none}
.cphoto img{flex:none;width:100%;height:300px;object-fit:cover;scroll-snap-align:start;display:block}
.cphoto .pv,.cphoto .nx{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#3b2a1a;font-size:22px;line-height:1;cursor:pointer;font-family:inherit}
.cphoto .pv{left:8px}.cphoto .nx{right:8px}
.cphoto .pv:hover,.cphoto .nx:hover{background:#fff}
.cphoto .dots{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:5px}
.cphoto .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55)}
.cphoto .dots i.on{background:#fff}
.nophoto{height:120px;background:linear-gradient(135deg,#ffe3ec,#fff5d6);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px}
.body{padding:12px 16px 14px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.name{font-weight:700;font-size:17px;color:var(--brown)}
.kind{font-size:11px;font-weight:700;color:#fff;background:var(--pink);border-radius:999px;padding:1px 9px}
.day{font-size:11px;font-weight:700;color:#fff;border-radius:999px;padding:1px 9px}
.icons{margin-left:auto;display:inline-flex;gap:6px}
.lnk{text-decoration:none;font-size:13px;font-weight:700;color:#2f7fc6;background:#e4f1fb;border:1.5px solid #aacfea;border-radius:999px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center}
.lnk:hover{background:#2f7fc6;color:#fff}
.lnk.map{background:#ffe3ec;border-color:#f6b7cd;font-size:12px}
.lnk.map:hover{background:#e8457c}
.desc{font-size:13.5px;color:var(--muted);margin-top:6px}
.tips{margin:8px 0 0 18px;padding:0;font-size:13px}
.tips li{margin:2px 0}
.tips li::marker{color:var(--pink)}
footer{margin-top:24px;font-size:12px;color:var(--muted);border-top:2px dashed var(--b-sky);padding-top:10px}
@media (max-width:640px){.cnav{padding:0 14px}.wrap{padding:16px 12px 50px}.cphoto img{height:220px}}
</style>
</head>
<body>
<nav class="cnav">
  <a href="../../index.html">Cworld</a><span class="sep">/</span>
  <a href="../index.html">旅遊</a><span class="sep">/</span>
  <a href="./">大阪馬拉松</a><span class="sep">/</span>
  <span class="current">吃什麼</span>
</nav>
<div class="wrap">
  <h1>吃什麼</h1>
  <p class="sub">這次要吃到：壽司、拉麵、居酒屋、燒肉、章魚燒。照行程排；📍 Google Map・↗ 官網</p>
  <div id="spots"></div>
  <footer>店家還沒定案的先列區域；確定後告訴我，我補店名、照片與連結。</footer>
</div>
<script src="days.js"></script>
<script>
const SPOTS=[
  {d:1, kind:'章魚燒', name:'なにわ食いしんぼ横丁', m:'なにわ食いしんぼ横丁', u:'https://www.kaiyukan.com/thv/marketplace/', p:['img/tempozan_1.jpg'],
   desc:'天保山 Market Place 2F，復古昭和街景的美食街，章魚燒、大阪燒、串炸都有。', tips:['海遊館出來直接過去','會津屋是大阪章魚燒元祖，這裡有分店']},
  {d:1, kind:'壽司', name:'天保山 Market Place 回轉壽司（待定）', m:'天保山マーケットプレース 寿司', u:'', p:[],
   desc:'同一棟商場解決晚餐，不用再移動。', tips:['比賽前兩天還可以吃生食，D2 之後就不要了','店家待定：到場看哪家人多']},
  {d:2, kind:'居酒屋', name:'京橋 居酒屋街', m:'京橋 居酒屋 大阪', u:'', p:[],
   desc:'飯店隔壁站，大阪數一數二的老派居酒屋區，JR 京橋站周邊整條都是。', tips:['賽前一晚：烤雞串、飯糰、烏龍麵，少喝酒','18:00–19:30，吃完回去整理裝備']},
  {d:3, kind:'燒肉', name:'鶴橋 燒肉街', m:'鶴橋 焼肉', u:'', p:[],
   desc:'大阪燒肉的代名詞，JR 鶴橋站一出來滿街烤肉味；完賽慶功就這裡。', tips:['JR 環狀線從鴫野直達約 10 分','人氣店會排隊，完賽後先回飯店洗澡再 18:30 過去','店家待定：空、白雲台、アジヨシ 都是常被點名的']},
  {d:4, kind:'拉麵', name:'井出商店（和歌山拉麵）', m:'井出商店 和歌山', u:'', p:[],
   desc:'和歌山拉麵的代表店，豚骨醬油濃厚系；桌上的早壽司、水煮蛋自己拿、吃完結帳。', tips:['離和歌山站步行約 10 分','12:20–13:10；13:10 要上車去機場，排隊太長就改 丸三']},
  {d:0, kind:'大阪燒', name:'千房／美津の', m:'千房 道頓堀', u:'https://www.chibo.com/', p:[],
   desc:'千房是機上餐那家的本店，美津の是道頓堀排隊名店；哪天有空檔就吃。', tips:['機上餐已經是千房大阪燒，想吃不一樣的選美津の']},
];
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
document.getElementById('spots').innerHTML=SPOTS.map(s=>{
  const map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.m);
  const photos=s.p.length?'<div class="cphoto"><div class="track">'+s.p.map(src=>'<img src="'+esc(src)+'" alt="">').join('')+'</div>'+(s.p.length>1?'<button type="button" class="pv">‹</button><button type="button" class="nx">›</button><div class="dots"></div>':'')+'</div>':'<div class="nophoto">（還沒放照片）</div>';
  return '<section class="spot">'+photos+'<div class="body"><div class="head"><span class="kind">'+esc(s.kind)+'</span>'+(s.d?'<span class="day" style="background:var(--d'+s.d+')">D'+s.d+'</span>':'')+'<span class="name">'+esc(s.name)+'</span>'+
    '<span class="icons"><a class="lnk map" href="'+esc(map)+'" target="_blank" rel="noopener" title="Google Map">📍</a>'+(s.u?'<a class="lnk" href="'+esc(s.u)+'" target="_blank" rel="noopener" title="官網">↗</a>':'')+'</span></div>'+
    (s.desc?'<div class="desc">'+esc(s.desc)+'</div>':'')+(s.tips&&s.tips.length?'<ul class="tips">'+s.tips.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>':'')+'</div></section>';
}).join('');
window.bindCarousels&&window.bindCarousels(document);
</script>
</body>
</html>
