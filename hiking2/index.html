<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>爬山2 · 完百計畫</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f4a3a'/%3E%3Cpath d='M10 50 L26 22 L34 34 L42 26 L56 50 Z' fill='%23e9e4d6'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f3f1ec;
      --surface: #fbfaf7;
      --line: #e3dfd5;
      --ink: #1f1f1d;
      --ink-2: #6e6b64;
      --ink-3: #a19d94;
      --brand: #2f4a3a;
      --red: #c0392b;
      --chip: #ece9e1;
      --dark: #121212;
      --serif: 'Noto Serif TC', 'PingFang TC', 'Microsoft JhengHei', serif;
      --sans: 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --tabbar-h: 68px;
    }
    html, body { background: #e6e3db; }
    body { font-family: var(--sans); color: var(--ink); -webkit-tap-highlight-color: transparent; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: none; }
    a { color: inherit; }

    .app {
      max-width: 480px; margin: 0 auto; min-height: 100vh;
      background: var(--bg); position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,.08);
    }

    /* ── App bar ── */
    .appbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 10px;
      height: 56px; padding: 0 16px;
      background: var(--bg); border-bottom: 1px solid var(--line);
    }
    .appbar .logo {
      width: 26px; height: 26px; border-radius: 7px; background: var(--brand);
      display: grid; place-items: center;
    }
    .appbar .logo svg { width: 18px; height: 18px; }
    .appbar .title { font-family: var(--serif); font-size: 1.05rem; letter-spacing: 3px; font-weight: 700; }
    .appbar .home { margin-left: auto; font-size: .78rem; color: var(--ink-2); text-decoration: none; padding: 4px 8px; }
    .appbar .help {
      width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line);
      display: grid; place-items: center; font-size: .85rem; color: var(--ink-2); background: var(--surface);
    }

    main#view { padding: 20px 16px calc(var(--tabbar-h) + 40px); }

    /* ── Tab bar ── */
    .tabbar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px; height: var(--tabbar-h); z-index: 60;
      display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
      background: rgba(251,250,247,.96); backdrop-filter: blur(8px);
      border-top: 1px solid var(--line); padding-bottom: 8px;
    }
    .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .68rem; color: var(--ink-3); text-decoration: none; }
    .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
    .tab.on { color: var(--ink); font-weight: 700; }
    .tab.fab { position: relative; }
    .tab.fab .disc {
      position: absolute; bottom: 20px; width: 54px; height: 54px; border-radius: 50%;
      background: var(--dark); display: grid; place-items: center;
      box-shadow: 0 0 0 5px var(--bg), 0 6px 16px rgba(0,0,0,.25);
    }
    .tab.fab .disc svg { stroke: #fff; width: 26px; height: 26px; }
    .tab.fab.on .disc { background: var(--brand); }

    /* ── Common ── */
    h1.page { font-family: var(--serif); font-size: 1.55rem; margin-bottom: 18px; letter-spacing: 1px; }
    .crumb { font-size: .78rem; color: var(--ink-2); text-decoration: none; display: inline-block; margin-bottom: 10px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
    .pad { padding: 16px; }
    .muted { color: var(--ink-2); }
    .small { font-size: .78rem; }
    .xs { font-size: .7rem; }
    .row { display: flex; align-items: center; gap: 8px; }
    .grow { flex: 1; min-width: 0; }
    .stack > * + * { margin-top: 12px; }
    .code {
      display: inline-block; border: 1.5px solid var(--red); color: var(--red);
      font-size: .7rem; font-weight: 700; padding: 1px 5px; border-radius: 3px;
      font-family: ui-monospace, Menlo, monospace; vertical-align: middle; letter-spacing: .5px;
    }
    .code.lg { font-size: .95rem; padding: 2px 7px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; justify-content: center;
      padding: 9px 14px; border: 1px solid var(--line); border-radius: 4px;
      background: var(--surface); font-size: .85rem; text-decoration: none;
    }
    .btn.dark { background: var(--dark); color: #fff; border-color: var(--dark); }
    .btn.block { width: 100%; }
    .btn:active { transform: scale(.98); }
    .warn { color: var(--red); font-size: .78rem; margin: 10px 0; }
    .chev { color: var(--ink-3); margin-left: auto; font-size: 1.1rem; }
    .empty { text-align: center; color: var(--ink-2); font-size: .82rem; padding: 18px 8px; line-height: 1.7; }
    .foot-note { font-size: .72rem; color: var(--ink-2); line-height: 1.7; margin-top: 18px; }

    /* search + segment */
    .search { display: flex; align-items: center; gap: 8px; padding: 11px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; }
    .search input { border: none; outline: none; background: none; flex: 1; font-size: .88rem; }
    .seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin: 12px 0 18px; }
    .seg a { text-align: center; padding: 10px 4px; font-size: .82rem; text-decoration: none; background: var(--surface); }
    .seg a small { color: var(--ink-3); font-size: .65rem; margin-left: 3px; }
    .seg a.on { background: var(--dark); color: #fff; }
    .seg a.on small { color: #aaa; }

    .hscroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px 16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
    .hscroll::-webkit-scrollbar { display: none; }
    .cat { flex: 0 0 116px; padding: 12px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; }
    .cat b { display: block; font-size: .85rem; }
    .cat span { font-size: .68rem; color: var(--ink-3); }
    .cat.on { border: 2px solid #4a6fa5; padding: 11px; }

    .list { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
    .item { display: flex; align-items: center; gap: 10px; padding: 14px; border-bottom: 1px solid var(--line); text-decoration: none; }
    .item:last-child { border-bottom: none; }
    .item .t { font-weight: 700; font-size: .95rem; }
    .item .s { font-size: .72rem; color: var(--ink-2); margin-top: 3px; }
    .item input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--brand); flex: none; }
    .n { display: inline-block; border: 1.5px solid var(--red); color: var(--red); font-size: .68rem; padding: 0 5px; border-radius: 3px; font-weight: 700; margin-right: 4px; }

    .sec-h { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
    .sec-h h3 { font-size: 1rem; }
    .pill { font-size: .72rem; padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
    .filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .filters select, .filters button { font-size: .75rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
    .filters button.on { background: var(--dark); color: #fff; }

    .action-card { display: block; padding: 16px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; text-decoration: none; text-align: left; width: 100%; }
    .action-card.dashed { border-style: dashed; }
    .action-card.hl { border: 1.5px solid #4a6fa5; }
    .action-card b { display: block; font-size: .95rem; margin-bottom: 6px; }
    .action-card p { font-size: .76rem; color: var(--ink-2); line-height: 1.6; }

    /* ── Trip planner ── */
    .trip-title { font-family: var(--serif); font-size: 1.45rem; line-height: 1.45; margin-bottom: 6px; }
    .ctl { display: grid; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .ctl:last-child { border-bottom: none; }
    .ctl label { font-size: .75rem; color: var(--ink-2); }
    .ctl .r { display: flex; align-items: center; gap: 14px; }
    .ctl input[type=range] { flex: 1; accent-color: #4a6fa5; }
    .ctl .v { font-size: 1.05rem; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
    .chips { display: flex; gap: 6px; margin-top: 6px; }
    .chips button { font-size: .72rem; padding: 4px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); }
    .ctl input[type=date], .ctl input[type=time], .field input, .field select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); font-size: .9rem;
    }
    .check { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--ink-2); margin-top: 4px; }
    .check input { accent-color: #4a6fa5; width: 16px; height: 16px; }

    .gantt { padding: 14px 12px 8px; position: relative; }
    .g-row { display: grid; grid-template-columns: 40px 1fr; align-items: center; height: 30px; }
    .g-row .d { font-size: .75rem; font-weight: 700; display: flex; align-items: center; gap: 5px; }
    .g-row .d i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .g-track { position: relative; height: 18px; background: repeating-linear-gradient(90deg, transparent 0 calc(100%/15 - 1px), #ebe8e0 calc(100%/15 - 1px) calc(100%/15)); }
    .g-bar { position: absolute; top: 0; height: 100%; border-radius: 2px; color: #fff; font-size: .62rem; white-space: nowrap; display: flex; align-items: center; padding-left: 4px; overflow: visible; }
    .g-bar span { position: absolute; left: 100%; padding-left: 4px; color: var(--ink); }
    .g-bar.over span { color: var(--red); font-weight: 700; }
    .g-axis { display: grid; grid-template-columns: 40px 1fr; font-size: .6rem; color: var(--ink-3); margin-top: 4px; }
    .g-axis div:last-child { display: flex; justify-content: space-between; }
    .g-dusk { position: absolute; top: 0; bottom: 0; border-left: 1.5px dashed var(--red); pointer-events: none; }
    .g-dusk b { position: absolute; top: -2px; right: 4px; font-size: .62rem; color: var(--red); font-weight: 500; white-space: nowrap; }

    .day { border-left: 4px solid var(--c, #333); }
    .day-h { padding: 14px 14px 10px; }
    .day-h .tt { font-family: var(--serif); font-size: 1.02rem; line-height: 1.5; color: var(--ink); }
    .day-h .tt em { font-style: normal; color: var(--c); margin-right: 6px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; margin-top: 10px; }
    .stats div small { display: block; font-size: .62rem; color: var(--ink-3); }
    .stats div b { font-size: 1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .stats .over b { color: var(--red); }
    .start-sel { font-size: .8rem; border: 1px solid var(--line); border-radius: 4px; padding: 5px 6px; background: var(--bg); }
    table.wp { width: 100%; border-collapse: collapse; font-size: .8rem; }
    table.wp th { font-size: .65rem; color: var(--ink-3); font-weight: 400; text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--bg); }
    table.wp td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    table.wp td.num { text-align: center; color: #a0522d; font-weight: 600; }
    table.wp td.time { text-align: right; font-variant-numeric: tabular-nums; }
    table.wp td.time small { display: block; font-size: .62rem; color: #4a6fa5; }
    table.wp .nm { font-weight: 600; }
    table.wp .meta { font-size: .65rem; color: var(--ink-3); }
    .tag { font-size: .62rem; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--line); white-space: nowrap; }
    .tag.camp { background: var(--dark); color: #fff; border-color: var(--dark); }
    .tag.light { color: #4a6fa5; border-color: #c4d1e6; }
    tr.late td.time { color: var(--red); }

    /* ── Done (完百) ── */
    .dark-sheet { position: fixed; inset: 0; z-index: 100; background: #0d0d0d; color: #eee; overflow-y: auto; }
    .dark-sheet .in { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
    .dark-sheet .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 18px; }
    .dark-sheet .top b { text-align: center; }
    .dark-sheet .top button { justify-self: end; background: #2a2a2a; color: #fff; padding: 6px 14px; border-radius: 16px; }
    .big-num { font-size: 2.6rem; font-weight: 700; }
    .big-num small { font-size: .95rem; color: #999; font-weight: 400; }
    .bar { height: 4px; background: #2a2a2a; border-radius: 2px; margin: 8px 0 18px; }
    .bar i { display: block; height: 100%; background: #e0a243; border-radius: 2px; }
    .poster { display: flex; gap: 14px; background: #1c1c1c; padding: 12px; border-radius: 8px; }
    .poster canvas { width: 72px; height: 100px; background: #eee; border-radius: 3px; flex: none; }
    .poster .meta b { display: block; margin-bottom: 4px; }
    .poster .meta small { color: #aaa; font-size: .72rem; display: block; }
    .poster .meta a { color: #e0a243; font-size: .72rem; text-decoration: none; display: inline-block; margin-top: 6px; }
    .import-btn { display: block; width: 100%; margin: 14px 0 8px; padding: 12px; background: #6b3d14; color: #f4c27a; border-radius: 22px; font-size: .85rem; }
    .grid100 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
    .grid100 button { background: #1f1f1f; color: #ddd; border-radius: 4px; padding: 8px 2px; font-size: .78rem; line-height: 1.35; }
    .grid100 button small { display: block; font-size: .58rem; color: #777; }
    .grid100 button.got { background: #e0a243; color: #1a1a1a; }
    .grid100 button.got small { color: #4a3510; }

    /* ── Map overlay ── */
    #map { height: calc(100vh - 56px - var(--tabbar-h) - 160px); min-height: 360px; border-radius: 6px; border: 1px solid var(--line); }
    .kpis { display: flex; gap: 36px; margin-bottom: 14px; }
    .kpis small { display: block; font-size: .68rem; color: var(--ink-2); }
    .kpis b { font-size: 1.3rem; font-weight: 500; }
    .pin { width: 12px; height: 12px; border-radius: 50%; background: #1d3557; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
    .pin.got { background: #e0a243; }

    /* ── Go (行進) ── */
    .go-big { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
    .go-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .go-grid .card { padding: 12px; }
    .go-grid small { font-size: .68rem; color: var(--ink-2); display: block; }
    .go-grid b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }

    .field { display: grid; gap: 4px; margin-bottom: 12px; }
    .field label { font-size: .72rem; color: var(--ink-2); }
    .day-in { display: grid; grid-template-columns: 30px repeat(3, 1fr); gap: 6px; align-items: center; margin-bottom: 6px; }
    .day-in input { padding: 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); width: 100%; font-size: .82rem; }
    .h-serif { font-family: var(--serif); font-size: 1.05rem; margin: 22px 0 8px; }

    /* 原本爬山頁的雲端同步狀態列，移到底部分頁列上方 */
    #sync-bar { bottom: calc(var(--tabbar-h) + 10px) !important; right: max(10px, calc(50vw - 230px)) !important; }
    .toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 20px); transform: translateX(-50%); background: var(--dark); color: #fff; padding: 10px 16px; border-radius: 20px; font-size: .82rem; z-index: 200; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.on { opacity: 1; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 150; display: grid; place-items: center; padding: 16px; }
    .modal .box { background: var(--surface); border-radius: 8px; max-width: 440px; width: 100%; max-height: 80vh; overflow: auto; padding: 18px; }
    .modal pre { white-space: pre-wrap; font-size: .78rem; background: var(--bg); padding: 12px; border-radius: 4px; margin: 10px 0; }
  </style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M2 20 L9 8 L12.5 13 L15.5 9.5 L22 20 Z" fill="#e9e4d6"/></svg></div>
    <div class="title">完百計畫</div>
    <a class="home" href="../">← Cworld</a>
    <button class="help" onclick="showHelp()">?</button>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <a class="tab" data-tab="trips" href="#trips">
      <svg viewBox="0 0 24 24"><path d="M3 20 L10 8 L13 13 L16 9 L21 20 Z"/><circle cx="17" cy="5" r="1.5"/></svg>行程</a>
    <a class="tab" data-tab="routes" href="#routes">
      <svg viewBox="0 0 24 24"><path d="M4 5 L9 3 L15 5 L20 3 V19 L15 21 L9 19 L4 21 Z M9 3 V19 M15 5 V21"/></svg>路線</a>
    <a class="tab fab" data-tab="go" href="#go">
      <div class="disc"><svg viewBox="0 0 24 24"><path d="M12 3 L19 20 L12 16 L5 20 Z"/></svg></div>行進</a>
    <a class="tab" data-tab="done" href="#done">
      <svg viewBox="0 0 24 24"><path d="M3 20 L10 7 L14 13 L17 10 L21 20 Z"/><path d="M10 7 V3 L13 4 L10 5"/></svg>完百</a>
    <a class="tab" data-tab="coef" href="#coef">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 13 L15 9 M10 3 H14"/></svg>我的係數</a>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="../hiking/peaks-data.js"></script>
<script src="../hiking/sync.js"></script>
<script src="routes-data.js"></script>
<script src="app.js"></script>
</body>
</html>
